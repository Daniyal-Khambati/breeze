<style>
  :root{
    --ink:#231a13;
    --ink-soft:#5c4c3a;
    --paper:#ecdbb2;
    --paper-2:#e2cf9c;
    --accent:#c1502c;
    --accent-dark:#7c341c;
    --lake:#3f6d8e;
    --moss:#5a6b3f;
    --near-mtn:#263454;
    --gold:#f4b942;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    font-family:'DM Sans', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    image-rendering:pixelated;
  }
  .frame{
    width:100%;
    max-width:420px;
    min-height:100vh;
    position:relative;
    z-index:1;
  }

  /* ---------- HERO: pinned behind the scrolling content, like a native app's parallax header ---------- */
  .hero-fixed{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:420px; aspect-ratio:20/9;
    overflow:hidden; z-index:0; pointer-events:none;
  }
  .hero-fixed canvas{
    display:block; width:100%; height:100%;
    image-rendering:pixelated;
  }
  .hero-spacer{ width:100%; aspect-ratio:20/9; }

  .content-sheet{
    position:relative;
    background: var(--bg-tile);
    background-repeat: repeat;
    image-rendering: pixelated;
    padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
  /* a soft seam so the sheet's edge dissolves into the fixed art behind it as it scrolls up over it,
     rather than cutting it off with a hard line */
  .content-sheet::before{
    content:""; position:absolute; left:0; right:0; top:0; height:30px;
    background:linear-gradient(to bottom, rgba(36,21,45,0.16), rgba(36,21,45,0));
    pointer-events:none; z-index:2;
  }
  .warm-wash{
    position:absolute; left:0; right:0; top:0; height:340px;
    background:linear-gradient(to bottom, rgba(193,80,44,0.10) 0%, rgba(193,80,44,0.045) 45%, rgba(193,80,44,0) 100%);
    pointer-events:none; z-index:0;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px 14px;
    border-bottom: 1px solid var(--paper-2);
  }
  .brand{
    font-family:'Bevan', serif;
    font-size:1.5rem;
    color:var(--accent-dark);
    line-height:1;
  }
  .top-actions{display:flex; align-items:center; gap:10px;}
  .btn-log{
    display:flex; align-items:center; gap:6px;
    background:var(--accent); color:var(--paper);
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    padding:10px 16px;
    border-radius:12px;
    box-shadow: 0 3px 8px rgba(124,52,28,0.35);
  }
  .avatar{
    width:36px; height:36px;
    background:var(--moss);
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    color:var(--paper); font-weight:600; font-family:'DM Sans',sans-serif; font-size:0.95rem;
  }

  /* ---------- BODY ---------- */
  .section{padding: 20px 20px 2px;}
  .h1{
    font-family:'Bevan', serif;
    font-size:1.8rem;
    margin:0 0 10px;
    color:var(--ink);
  }
  .eyebrow{
    font-weight:500; font-size:0.82rem;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  .divider-trail{
    height:10px; margin: 14px 20px 0;
    background-image: repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 14px);
    opacity:0.6;
  }

  .stat-row{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;
    padding: 16px 20px 4px;
  }
  .stat-card{
    background:var(--paper-2);
    border-radius:14px;
    box-shadow: 0 2px 7px rgba(35,26,19,0.12);
    padding:12px 10px;
  }
  .stat-icon{
    width:32px; height:32px;
    background:var(--gold);
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:8px;
  }
  .stat-label{font-weight:500; font-size:0.78rem; line-height:1.25; color:var(--ink); margin-bottom:4px;}
  .stat-value{font-size:0.72rem; color:var(--ink-soft); font-weight:500;}

  .filter-row{ display:flex; justify-content:flex-end; padding: 14px 20px 0; }
  .pill-select{
    display:flex; align-items:center; gap:8px;
    background:var(--paper-2); border-radius:999px;
    font-weight:500; font-size:0.8rem; padding:8px 14px;
    box-shadow: 0 2px 6px rgba(35,26,19,0.1);
  }

  .feed{ display:flex; flex-direction:column; gap:14px; padding: 16px 20px 8px; }
  .card{
    background:var(--paper-2);
    border-radius:16px;
    box-shadow: 0 4px 14px rgba(35,26,19,0.14);
    padding:14px;
  }
  .card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .who{display:flex; align-items:center; gap:9px;}
  .who .avatar{width:30px; height:30px; font-size:0.82rem;}
  .who-name{font-weight:600; font-size:0.86rem;}
  .who-time{font-size:0.7rem; color:var(--ink-soft); font-weight:500;}
  .tag{
    display:flex; align-items:center; gap:6px;
    font-weight:500; font-size:0.68rem;
    padding:6px 11px; border-radius:8px; color:var(--paper);
  }
  .tag.lookout{background:var(--lake);}
  .tag.kayak{background:var(--near-mtn);}
  .card-title{font-family:'Bevan', serif; font-size:1.05rem; margin:0 0 10px; color:var(--ink); line-height:1.3;}
  .loc{display:flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--ink-soft); font-weight:500; margin-bottom:12px;}
  .card-bottom{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .rank-badge{
    background:var(--gold); border-radius:8px;
    font-family:'DM Sans', sans-serif; font-weight:600; font-size:0.8rem;
    padding:6px 10px; white-space:nowrap;
  }
  .trail-progress{ display:flex; align-items:center; gap:6px; flex:1; }
  .trail-track{ position:relative; flex:1; height:7px; background:var(--paper); border-radius:999px; }
  .trail-fill{ position:absolute; left:0; top:0; height:100%; width:43%; background:var(--accent); border-radius:999px; }
  .trail-hiker{ position:absolute; left:43%; top:50%; transform:translate(-50%,-58%); }

  /* ---------- BOTTOM NAV ---------- */
  .navbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:420px;
    background:var(--paper-2);
    box-shadow: 0 -4px 16px rgba(35,26,19,0.12);
    border-radius: 20px 20px 0 0;
    display:flex;
    padding: 10px 4px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index:2;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    font-size:0.6rem; font-weight:500; color:var(--ink-soft); padding:6px 0;
  }
  .nav-item.active{color:var(--accent-dark);}
  .nav-item.active .nav-icon-wrap{ background:var(--gold); border-radius:9px; }
  .nav-icon-wrap{width:28px; height:28px; display:flex; align-items:center; justify-content:center;}

  svg.pxicon rect{shape-rendering:crispEdges;}
</style>

<script>
(function(){
  // ---------- helpers ----------
  function hex(h){ h=h.replace('#',''); return [parseInt(h.substring(0,2),16),parseInt(h.substring(2,4),16),parseInt(h.substring(4,6),16)]; }
  var BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  function bayer(x,y){ return (BAYER[y&3][x&3]+0.5)/16; }
  function noise(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
  function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function ridgeY(pts, xf, H){
    for(var i=0;i<pts.length-1;i++){
      if(xf>=pts[i][0] && xf<=pts[i+1][0]){
        var t=(xf-pts[i][0])/(pts[i+1][0]-pts[i][0]);
        return lerp(pts[i][1],pts[i+1][1],t)*H;
      }
    }
    return pts[pts.length-1][1]*H;
  }

  function render(canvas){
    var W=canvas.width, H=canvas.height;
    var ctx=canvas.getContext('2d');
    var img=ctx.createImageData(W,H);
    var data=img.data;
    function px(x,y,rgb,a){
      if(x<0||x>=W||y<0||y>=H) return;
      var i=(y*W+x)*4;
      data[i]=rgb[0]; data[i+1]=rgb[1]; data[i+2]=rgb[2]; data[i+3]= a===undefined?255:a;
    }

    // ---- sky bands: mostly flat color fields with a fine grainy dithered seam between them. The horizon (where
    // the sky meets the dark backdrop below) is given an irregular, hand-drawn edge instead of one straight
    // cutoff row, using a few low-frequency waves plus fine grain. ----
    var skyH = Math.floor(H*0.62);
    var stops=[hex('#33192e'),hex('#502335'),hex('#712936'),hex('#973432'),hex('#c04f31'),hex('#dc7433'),hex('#ec9c3f'),hex('#f4bd58')];
    var segH = skyH/(stops.length-1);
    var horizonBase = hex('#241531');
    function horizonOffset(x){
      return 5*(0.55*Math.sin(x*0.085+0.6) + 0.30*Math.sin(x*0.19+2.1) + 0.15*Math.sin(x*0.47+1.0));
    }
    for(var x=0;x<W;x++){
      var effBottom = skyH + Math.round(horizonOffset(x));
      for(var y=0;y<H;y++){
        if(y<effBottom){
          var seg=Math.min(stops.length-2, Math.floor(y/segH));
          var localT=(y-seg*segH)/segH;
          var jitter=(noise(x*0.6,y*0.6)-0.5)*0.55;
          var tt=localT+jitter;
          var c = tt>0.5 ? stops[seg+1] : stops[seg];
          px(x,y,c,255);
        } else {
          var edgeJ = noise(x*0.7,y*0.7)>0.86 ? mix(horizonBase,[0,0,0],0.12) : horizonBase;
          px(x,y,edgeJ,255);
        }
      }
    }

    // ---- sun + glow ----
    var sunX=Math.floor(W*0.76), sunY=Math.floor(H*0.14), sunR=Math.floor(H*0.075);
    var sunCore=hex('#fff3c4'), sunMid=hex('#f9d77e');
    for(var y2=0;y2<skyH;y2++){
      for(var x2=0;x2<W;x2++){
        var dx=x2-sunX, dy=y2-sunY, d=Math.sqrt(dx*dx+dy*dy);
        if(d<sunR){ px(x2,y2, d<sunR*0.6?sunCore:sunMid, 255); }
        else if(d<sunR*2.8){
          var g=1-((d-sunR)/(sunR*1.8));
          if(g>0 && noise(x2*0.8,y2*0.8) < g*0.75){ px(x2,y2, sunMid, 255); }
        }
      }
    }

    // ---- clouds: organic multi-lobe cumulus, lit toward the sun, dithered painterly shading ----
    function drawCloud(spec){
      var cx=spec.cx*W, cy=spec.cy*H, s=spec.scale*H;
      var lobes=spec.lobes.map(function(l){ return {x:cx+l[0]*s, y:cy+l[1]*s, r:l[2]*s}; });
      var minX=W,maxX=0,minY=H,maxY=0;
      lobes.forEach(function(l){
        minX=Math.min(minX,l.x-l.r); maxX=Math.max(maxX,l.x+l.r);
        minY=Math.min(minY,l.y-l.r); maxY=Math.max(maxY,l.y+l.r);
      });
      minX=Math.max(0,Math.floor(minX)); maxX=Math.min(W,Math.ceil(maxX));
      minY=Math.max(0,Math.floor(minY)); maxY=Math.min(H,Math.ceil(maxY));
      var sunSide = (sunX-cx) >= 0 ? 1 : -1;
      var warm=hex(spec.warm), mid=hex(spec.mid), shadow=hex(spec.shadow);
      var bh = (maxY-minY) || 1, bw=(maxX-minX) || 1;
      for(var yy=minY; yy<maxY; yy++){
        for(var xx=minX; xx<maxX; xx++){
          var inside=false;
          for(var i=0;i<lobes.length;i++){
            var l=lobes[i], dx=xx-l.x, dy=yy-l.y, dn=Math.sqrt(dx*dx+dy*dy)/l.r;
            if(dn<1){ inside=true; break; }
          }
          if(!inside) continue;
          // simple top-lit / underside-shadow volume shading, biased toward the sun's side
          var vertT = 1 - (yy-minY)/bh;              // 1 = top (lit), 0 = bottom (shadow)
          var horizT = ((xx-cx)/(bw*0.5)) * sunSide;  // + toward sun side
          var jitter=(noise(xx*0.85+cx*3,yy*0.85+cy*3)-0.5)*0.30;
          var tt = vertT*0.62 + horizT*0.22 + jitter - 0.28;
          var col = tt>0.30 ? warm : (tt>0.02 ? mid : shadow);
          px(xx,yy,col,255);
        }
      }
    }
    var cloudLobesBig=[[0,0,1],[-1.05,0.18,0.78],[1.0,0.12,0.82],[-0.5,-0.4,0.66],[0.55,-0.32,0.68],[-1.75,0.32,0.5],[1.7,0.28,0.52],[0.1,0.42,0.62]];
    var cloudLobesSml=[[0,0,1],[-1,0.15,0.74],[0.95,0.1,0.78],[-0.5,-0.32,0.6],[0.5,-0.28,0.62],[1.55,0.24,0.48]];
    drawCloud({cx:0.17,cy:0.19,scale:0.135,lobes:cloudLobesBig,warm:'#d98a52',mid:'#93555c',shadow:'#3c2340'});
    drawCloud({cx:0.58,cy:0.235,scale:0.09,lobes:cloudLobesSml,warm:'#f2b16a',mid:'#c07862',shadow:'#4d2c48'});
    drawCloud({cx:0.79,cy:0.24,scale:0.125,lobes:cloudLobesBig,warm:'#fbd28a',mid:'#e0955f',shadow:'#7a4142'});

    // ---- distant birds: small dark wing-stroke silhouettes, classic sunset-scene flourish ----
    function drawBird(cx,cy,scale,color){
      var c=hex(color);
      for(var d=1; d<=scale; d++){
        px(Math.floor(cx-d), Math.floor(cy-d), c, 255);
        px(Math.floor(cx+d), Math.floor(cy-d), c, 255);
      }
      px(Math.floor(cx), Math.floor(cy), c, 255);
    }
    drawBird(W*0.365, H*0.155, 3, '#2c1c22');
    drawBird(W*0.405, H*0.19, 2, '#2c1c22');
    drawBird(W*0.685, H*0.095, 3, '#33202a');
    drawBird(W*0.71, H*0.125, 2, '#33202a');

    // ---- foreground ground ----
    var groundPts=[[0,.90],[.15,.84],[.30,.90],[.45,.85],[.60,.92],[.75,.86],[.90,.91],[1,.87]];
    var groundBase=hex('#0d0b0a'), groundFleck=hex('#1d1613');
    for(var x5=0;x5<W;x5++){
      var gy=ridgeY(groundPts, x5/(W-1), H);
      for(var y5=Math.floor(gy); y5<H; y5++){
        var c5 = bayer(x5*7+1,y5*3+2)>0.82 ? groundFleck : groundBase;
        px(x5,y5,c5,255);
      }
    }

    // ---- pine trees: same volumetric technique as the clouds/river — tiered pine silhouettes shaded with a
    // sun-facing highlight, a mossy midtone, and a deep shadow side, plus fine dithered grain, instead of a
    // flat black silhouette ----
    function drawPine(cx, baseY, h, warmC, midC, shadowC){
      var warm=hex(warmC), mid=hex(midC), shadow=hex(shadowC);
      var sunSide = (sunX-cx)>=0 ? 1 : -1;
      var tiers=4, tierH=h*0.30;
      for(var i=0;i<tiers;i++){
        var top = baseY - h + i*(tierH*0.76);
        var widthMax = (h*0.30) * (0.40 + 0.60*(i/(tiers-1)));
        for(var ty=0; ty<tierH; ty++){
          var y=Math.floor(top+ty);
          if(y<0||y>=H) continue;
          var rowFrac = ty/tierH;               // 0 = pointed tip of tier, 1 = wide base of tier
          var halfw = Math.max(0.7, widthMax*rowFrac);
          for(var dx=-halfw; dx<=halfw; dx++){
            var x=Math.floor(cx+dx);
            var nx = dx/(halfw||1);
            var vert = 1-rowFrac;                // brighter near each tier's tip
            var jitter=(noise(x*1.1+cx*2,y*1.1)-0.5)*0.34;
            var tt = vert*0.28 + (nx*sunSide)*0.44 + jitter + 0.02;
            var c = tt>0.34 ? warm : (tt>0.00 ? mid : shadow);
            px(x,y,c,255);
          }
        }
      }
      for(var yt=Math.floor(baseY-3); yt<baseY+2; yt++){ px(Math.floor(cx), yt, [38,26,17],255); }
    }
    var pineSpots=[[0.05,17,1],[0.10,24,1],[0.16,14,0.9],[0.845,15,1],[0.895,25,1],[0.955,13,0.9]];
    for(var pt=0; pt<pineSpots.length; pt++){
      var pxFrac=pineSpots[pt][0], ph=pineSpots[pt][1];
      var pby=ridgeY(groundPts, pxFrac, H) + 5;
      drawPine(pxFrac*W, pby, ph, '#cf9f57', '#4c6b46', '#16241a');
    }

    // ---- bushes: small rounded metaball clumps in the open banks between the pines and the river, shaded with
    // the same lit/mid/shadow banding as everything else ----
    function drawBush(cx, baseY, r, warmC, midC, shadowC){
      var warm=hex(warmC), mid=hex(midC), shadow=hex(shadowC);
      var sunSide=(sunX-cx)>=0?1:-1;
      var lobes=[[0,-0.2,1],[-0.75,0.05,0.72],[0.75,0.0,0.75],[-0.2,-0.55,0.6],[0.35,-0.5,0.62]];
      var pts=lobes.map(function(l){ return {x:cx+l[0]*r, y:baseY+l[1]*r, r:l[2]*r}; });
      var minX=W,maxX=0,minY=H,maxY=0;
      pts.forEach(function(l){ minX=Math.min(minX,l.x-l.r); maxX=Math.max(maxX,l.x+l.r); minY=Math.min(minY,l.y-l.r); maxY=Math.max(maxY,l.y+l.r); });
      minX=Math.max(0,Math.floor(minX)); maxX=Math.min(W,Math.ceil(maxX));
      minY=Math.max(0,Math.floor(minY)); maxY=Math.min(H,Math.ceil(maxY));
      var bh=(maxY-minY)||1;
      for(var yy=minY; yy<maxY; yy++){
        for(var xx=minX; xx<maxX; xx++){
          var inside=false;
          for(var i=0;i<pts.length;i++){ var l=pts[i],dx=xx-l.x,dy=yy-l.y,dn=Math.sqrt(dx*dx+dy*dy)/l.r; if(dn<1){inside=true;break;} }
          if(!inside) continue;
          var vertT=1-(yy-minY)/bh;
          var horizT=((xx-cx)/r)*sunSide;
          var jitter=(noise(xx*1.3+cx,yy*1.3)-0.5)*0.32;
          var tt=vertT*0.42 + horizT*0.4 + jitter - 0.10;
          var c = tt>0.36 ? warm : (tt>0.02 ? mid : shadow);
          px(xx,yy,c,255);
        }
      }
    }
    // placed by a fixed height on the bank (not the ground ridge) so they sit clear of the paper fade at the
    // very bottom of the canvas and stay legible
    var bushSpots=[[0.225,5.5,0.755],[0.27,4,0.795],[0.335,3.8,0.735],[0.665,4,0.735],[0.725,5,0.795],[0.775,3.8,0.755]];
    for(var bt=0; bt<bushSpots.length; bt++){
      var bxFrac=bushSpots[bt][0], br=bushSpots[bt][1], byFrac=bushSpots[bt][2];
      drawBush(bxFrac*W, byFrac*H, br, '#c99a52', '#4a6b3e', '#182619');
    }

    // ---- riverside rocks: small rounded stones catching the same warm/shadow light ----
    function drawRock(cx, baseY, r, litC, midC, shadeC){
      var lit=hex(litC), mid=hex(midC), shade=hex(shadeC);
      var sunSide=(sunX-cx)>=0?1:-1;
      for(var yy=Math.floor(baseY-r*1.3); yy<=baseY; yy++){
        var rowT=(baseY-yy)/(r*1.3);
        var halfw=r*Math.sqrt(Math.max(0,1-Math.pow(1-rowT,2)));
        for(var dx=-halfw; dx<=halfw; dx++){
          var x=Math.floor(cx+dx);
          var nx=dx/(halfw||1);
          var jitter=(noise(x*1.4+cx,yy*1.4)-0.5)*0.3;
          var tt=rowT*0.35 + (nx*sunSide)*0.5 + jitter + 0.05;
          var c = tt>0.42 ? lit : (tt>0.05 ? mid : shade);
          px(x,Math.floor(yy),c,255);
        }
      }
    }
    drawRock(W*0.345, H*0.80, 3.4, '#c9b998', '#7a6f5c', '#332c22');
    drawRock(W*0.635, H*0.795, 2.8, '#c9b998', '#7a6f5c', '#332c22');

    // ---- river: recedes from a wide foreground up to a vanishing point right at the horizon line (never above
    // it, so it doesn't poke into the sky), flowing toward the sky. Same volumetric technique as the clouds —
    // bright sun-glint center, fading to shadowed banks at the edges — drawn on top of the meadow so it visibly
    // carves through it. ----
    var riverPts=[[0.50,0.64],[0.48,0.70],[0.535,0.775],[0.485,0.85],[0.52,0.92],[0.495,1.0]];
    var riverWarm=hex('#f6c26e'), riverMid=hex('#6a7fa0'), riverShadow=hex('#232c48');
    var riverTop = riverPts[0][1];
    for(var y6=Math.floor(H*riverTop); y6<H; y6++){
      var yf=y6/H;
      var cx6=W*0.5;
      for(var i2=0;i2<riverPts.length-1;i2++){
        var y0=riverPts[i2][1], y1=riverPts[i2+1][1];
        if(yf>=y0 && yf<=y1){
          var tt=(yf-y0)/(y1-y0+0.0001);
          cx6 = lerp(riverPts[i2][0], riverPts[i2+1][0], tt) * W;
          break;
        }
      }
      var progress = Math.pow((yf-riverTop)/(1-riverTop), 1.5);
      var halfw = Math.max(1.5, H*(0.012 + 0.30*progress));
      var horizBias = 1-Math.min(1, Math.abs(cx6-sunX)/(W*0.6));
      for(var xw=-halfw; xw<=halfw; xw++){
        var xx6=Math.floor(cx6+xw);
        var distT=Math.abs(xw)/halfw;
        var jitter=(noise(xx6*0.9,y6*0.9)-0.5)*0.30;
        var tt2=(1-distT)*0.60 + horizBias*0.24 + jitter - 0.24;
        var c6 = tt2>0.38 ? riverWarm : (tt2>0.08 ? riverMid : riverShadow);
        // crisp dark bank edge
        if(distT>0.86) c6 = mix(riverShadow,[0,0,0],0.25);
        px(xx6,y6,c6,255);
      }
    }

    // ---- fade the ground into the page paper tone, so the hero dissolves into the content instead of cutting off ----
    var paperC = hex('#ecdbb2');
    var fadeRows = Math.floor(H*0.20);
    for(var yf2=H-fadeRows; yf2<H; yf2++){
      var ft = Math.pow((yf2-(H-fadeRows))/fadeRows, 1.3);
      for(var xf2=0; xf2<W; xf2++){
        var idx=(yf2*W+xf2)*4;
        var cur=[data[idx],data[idx+1],data[idx+2]];
        var blended = mix(cur, paperC, Math.min(1, ft + (bayer(xf2,yf2)-0.5)*0.18));
        data[idx]=blended[0]; data[idx+1]=blended[1]; data[idx+2]=blended[2];
      }
    }

    ctx.putImageData(img,0,0);
  }

  var heroCanvas = document.getElementById('heroCanvas');
  render(heroCanvas);

  // ---- tileable dithered paper texture for full-page background ----
  var tile=document.createElement('canvas');
  tile.width=16; tile.height=16;
  var tctx=tile.getContext('2d');
  var timg=tctx.createImageData(16,16);
  var pA=hex('#eeddb4'), pB=hex('#dfc48c');
  for(var y=0;y<16;y++){
    for(var x=0;x<16;x++){
      var i=(y*16+x)*4;
      var c = bayer(x,y) > 0.5 ? pA : pB;
      var noisy = Math.random() < 0.12 ? mix(c,[0,0,0],0.05) : c;
      timg.data[i]=noisy[0]; timg.data[i+1]=noisy[1]; timg.data[i+2]=noisy[2]; timg.data[i+3]=255;
    }
  }
  tctx.putImageData(timg,0,0);
  document.getElementById('frame').style.setProperty('--bg-tile', 'url(' + tile.toDataURL() + ')');
  document.getElementById('frame').style.backgroundSize = '16px 16px';
})();
</script>
