<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Breeze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Ported from design/breeze-mock.html: warm paper, a rust "trail blaze"
     accent, and lake/moss/near-mtn as secondary tag colors pulled from the
     hero scene's own palette. */
  --bg: #ecdbb2;
  --surface: #f3e7c4;
  --surface-2: #e2cf9c;
  --surface-3: #d6bd88;
  --border: #d2b989;
  --border-soft: #e2cf9c;
  --text: #231a13;
  --text-secondary: #5c4c3a;
  --text-muted: #8a765a;
  --accent: #c1502c;
  --accent-strong: #7c341c;
  --accent-soft: rgba(193, 80, 44, 0.14);
  --on-accent: var(--bg);
  --gold: #f4b942;
  --gold-soft: rgba(244, 185, 66, 0.22);
  --on-gold: #2c1c08;
  --lake: #3f6d8e;
  --moss: #5a6b3f;
  --near-mtn: #263454;
  --danger: #7c341c;
  --danger-soft: rgba(124, 52, 28, 0.16);
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;
  --shadow-sm: 0 2px 7px rgba(35, 26, 19, 0.12);
  --shadow-md: 0 4px 14px rgba(35, 26, 19, 0.16);
  --font-sans: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Bevan', Georgia, serif;
  --font-mono: var(--font-sans);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  font-size: 16px; line-height: 1.5;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 84px; }
img { max-width: 100%; display: block; }

/* ---------- Hero: a pinned canvas scene behind the scrolling content,
   ported from design/breeze-mock.html's hero-fixed/content-sheet pattern —
   the art stays in place while the content sheet scrolls up over it. ---------- */
#heroFixed {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; aspect-ratio: 20 / 9;
  overflow: hidden; z-index: 0; pointer-events: none;
}
#heroFixed canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.hero-spacer { width: 100%; aspect-ratio: 20 / 9; flex-shrink: 0; }
.content-sheet {
  position: relative; z-index: 1; flex: 1;
  background: var(--bg-tile, var(--bg)); background-repeat: repeat; background-size: 16px 16px;
  image-rendering: pixelated;
}
/* A soft seam so the sheet's top edge dissolves into the pinned art behind
   it as it scrolls up over it, instead of a hard cutoff line. */
.content-sheet::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 30px;
  background: linear-gradient(to bottom, rgba(30, 20, 15, 0.15), rgba(30, 20, 15, 0));
  pointer-events: none; z-index: 2;
}
.warm-wash {
  position: absolute; left: 0; right: 0; top: 0; height: 320px;
  background: linear-gradient(to bottom, rgba(193, 80, 44, 0.10) 0%, rgba(193, 80, 44, 0.045) 45%, rgba(193, 80, 44, 0) 100%);
  pointer-events: none; z-index: 0;
}
button { font-family: var(--font-sans); cursor: pointer; }
input, textarea, select { font-family: var(--font-sans); }
[hidden] { display: none !important; }
svg { width: 1em; height: 1em; flex-shrink: 0; }
svg.pxicon rect { shape-rendering: crispEdges; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* Scene banner — a static, flat-vector illustrated strip (banded sunset
   sky, layered mountain silhouettes, a treeline framing the edges, and the
   hiker sprite on the trail) that sits above the functional top bar. It is
   purely decorative and scrolls away with the page like a masthead. */
/* Top bar — lives inside .content-sheet now, so it scrolls with the page
   rather than sitting in its own sticky strip above the pinned hero. */
.topbar {
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--surface-2); position: relative; z-index: 1;
}
.brand {
  font-family: var(--font-display); font-size: 24px;
  letter-spacing: -0.01em; color: var(--accent-strong); line-height: 1;
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.log-btn {
  display: flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent);
  border: none; padding: 10px 16px 10px 13px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px;
  box-shadow: 0 3px 8px rgba(124, 52, 28, 0.35);
}
.log-btn svg { font-size: 15px; }
.log-btn:active { filter: brightness(0.92); }
.avatar-btn {
  width: 36px; height: 36px; border-radius: 11px; border: none; color: var(--bg);
  font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.02em;
}

/* Onboarding — reuses the same pinned-hero + content-sheet pattern as the
   main shell, with the copy and form in the sheet instead of tab screens. */
.onboard-wrap { text-align: center; }
.onboard-body { width: 100%; box-sizing: border-box; padding: 30px 32px 32px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
.onboard-wrap h1 {
  font-family: var(--font-display); color: var(--accent-strong); font-weight: 400;
  font-size: 30px; margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance;
}
.onboard-wrap p { color: var(--text-secondary); font-size: 14.5px; line-height: 1.55; margin: 0 0 26px; max-width: 320px; text-wrap: balance; }
.onboard-form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }

.field-input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 15px; outline: none;
}
.field-input::placeholder { color: var(--text-muted); opacity: 1; }
.field-input:focus { border-color: var(--accent); }
textarea.field-input { resize: none; font-size: 15px; }

.btn-primary {
  background: var(--accent); color: var(--on-accent); border: 1px solid var(--border); padding: 12px 20px; border-radius: var(--radius-md);
  font-weight: 700; font-size: 15px; width: 100%;
}
.btn-primary:active { background: var(--accent-strong); }
.btn-primary:disabled { opacity: 0.5; }
.btn-secondary {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  padding: 11px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px;
}
.btn-secondary:active { background: var(--surface-2); }
.btn-ghost {
  background: transparent; border: none; color: var(--text-secondary); font-size: 12.5px; font-weight: 600;
  padding: 6px;
}
.btn-ghost:hover { color: var(--text); }

/* Main content */
.screen { flex: 1; padding: 4px 20px 20px; position: relative; z-index: 1; }
.screen-title {
  font-family: var(--font-display); font-weight: 400; font-size: 27px; margin: 4px 0 4px;
  letter-spacing: -0.01em; text-wrap: balance; color: var(--text);
}
.screen-sub {
  color: var(--text-secondary); font-size: 12.5px; margin: 0 0 12px; font-weight: 500;
}
/* A dashed rust "trail" divider, ported from the mock's .divider-trail. */
.divider-trail {
  height: 10px; margin: 8px 0 4px;
  background-image: repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 14px);
  opacity: 0.6;
}

/* Featured lists row — restyled as the mock's icon-square stat cards, kept
   horizontally scrollable since we have more than 3 categories. */
.featured-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 14px; margin-bottom: 4px; scrollbar-width: none; }
.featured-row::-webkit-scrollbar { display: none; }
.featured-card {
  flex-shrink: 0; width: 130px; background: var(--surface-2); border: none; border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm); padding: 12px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left;
}
.featured-card .ft-icon {
  width: 32px; height: 32px; border-radius: 9px; background: var(--gold); color: var(--on-gold);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.featured-card .ft-title { font-weight: 500; font-size: 12.5px; line-height: 1.25; color: var(--text); }
.featured-card .ft-sub { font-size: 11.5px; color: var(--text-secondary); font-weight: 500; }
.featured-card.prompt { background: var(--accent-soft); color: var(--accent-strong); }
.featured-card.prompt .ft-icon { background: var(--accent); color: var(--on-accent); }

/* Filter dropdown */
.filter-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.filter-dropdown { position: relative; }
.filter-trigger {
  display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: none;
  border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 500; color: var(--text);
  box-shadow: var(--shadow-sm);
}
.filter-trigger svg:first-child { font-size: 13px; color: var(--text-secondary); }
.filter-trigger svg:last-child { font-size: 13px; color: var(--text-muted); transition: transform 0.15s ease; }
.filter-trigger.open svg:last-child { transform: rotate(180deg); }
.filter-menu {
  position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: none;
  border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 6px; min-width: 172px; z-index: 15;
  display: flex; flex-direction: column; gap: 1px; max-height: 320px; overflow-y: auto;
}
.filter-option {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px;
  font-weight: 500; color: var(--text-secondary); background: none; border: none; width: 100%; text-align: left;
}
.filter-option svg { font-size: 15px; }
.filter-option.active { background: var(--accent-soft); color: var(--accent-strong); }

/* Activity card */
.card {
  background: var(--surface-2); border-radius: var(--radius-lg); border: none;
  box-shadow: var(--shadow-md); margin-bottom: 14px; overflow: hidden;
}
.card-photo { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--surface-3); }
.card-body { padding: 14px; }
.card-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.mini-avatar {
  width: 28px; height: 28px; border-radius: 9px; color: var(--bg); font-weight: 600; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.card-user-name { font-weight: 600; font-size: 13px; }
.card-time { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
.card-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.card-title { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: -0.01em; line-height: 1.3; }
.card-loc { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-secondary); font-weight: 500; margin-bottom: 11px; }
.card-loc svg { font-size: 13px; color: var(--text-muted); }
.card-review { font-size: 13.5px; color: var(--text); line-height: 1.55; margin-bottom: 11px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rank-badge {
  display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 6px 10px;
  border-radius: var(--radius-sm); background: var(--gold); color: var(--on-gold); white-space: nowrap;
}
.rank-badge svg { font-size: 12px; }
.rank-badge.empty { background: none; padding: 4px 0; color: var(--text-muted); font-weight: 500; }
.save-btn {
  background: none; border: none; padding: 4px; color: var(--text-muted); font-size: 19px;
  display: flex; align-items: center;
}
.save-btn.saved { color: var(--accent); }
.type-tag {
  display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 6px 11px;
  border-radius: var(--radius-sm);
}
.type-tag svg { font-size: 11px; }

/* A trail-progress bar riding a tiny hiker sprite at its fill point, ported
   from the mock's .trail-progress — shows an activity's rank position
   visually, alongside the numeric "#N of M" rank badge. */
.trail-progress { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.trail-track { position: relative; flex: 1; height: 7px; background: var(--surface-3); border-radius: 999px; }
.trail-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 999px; }
.trail-hiker { position: absolute; top: 50%; transform: translate(-50%, -58%); }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state .icon-wrap {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 14px;
}
.empty-state p { font-size: 13.5px; margin: 0; max-width: 260px; margin-inline: auto; line-height: 1.5; }
.empty-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.empty-actions .btn-primary, .empty-actions .btn-secondary { width: auto; padding-inline: 18px; }

/* Log form */
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; display: block;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.type-opt {
  padding: 12px 4px 10px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: var(--text-secondary);
}
.type-opt.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.type-opt svg { font-size: 19px; }
.photo-upload {
  border: 1.5px dashed var(--border); border-radius: var(--radius-md); padding: 18px; text-align: center;
  color: var(--text-muted); font-size: 12.5px; position: relative; cursor: pointer;
}
.photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-preview { width: 100%; border-radius: var(--radius-md); margin-top: 10px; max-height: 190px; object-fit: cover; }

/* Overlay / modal */
.overlay {
  position: fixed; inset: 0; background: rgba(30, 27, 20, 0.5); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
}
.overlay.center { align-items: center; padding: 20px; }
.modal {
  background: var(--bg); border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border: none;
}
.overlay.center .modal { border-radius: 18px; }
.modal-title {
  font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 4px;
  text-align: center; letter-spacing: -0.01em;
}
.modal-sub { font-size: 12.5px; color: var(--text-secondary); text-align: center; margin: 0 0 20px; }

/* Friends sheet */
.friend-code-box {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px;
}
.friend-code-box .code { font-family: var(--font-mono); font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: var(--text); }
.add-friend-row { display: flex; gap: 8px; }
.add-friend-row .field-input { flex: 1; }
.add-friend-row .btn-primary { width: auto; flex-shrink: 0; padding-inline: 18px; }
.friend-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; }
.friend-row .name { flex: 1; font-weight: 600; font-size: 13.5px; }

/* Summit (mountain gamification) */
.mountain-wrap { border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); margin-bottom: 14px; }
.mountain-wrap svg { display: block; width: 100%; height: auto; }
.climb-readout { font-size: 12.5px; color: var(--text-secondary); text-align: center; margin: 0 0 16px; }
.progress-bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin: 0 0 10px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.scope-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.scope-toggle { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 2px; }
.scope-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-sm); border: none; background: none; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.scope-btn svg { font-size: 13px; }
.scope-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.dest-list { margin-top: 4px; }
.dest-row {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface-2);
  border: none; box-shadow: var(--shadow-sm); border-radius: var(--radius-md); margin-bottom: 8px; text-align: left;
}
.dest-row.done { border-color: var(--accent); background: var(--accent-soft); }
.dest-check {
  width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: var(--on-accent);
}
.dest-row.done .dest-check { background: var(--accent); border-color: var(--accent); }
.dest-check svg { font-size: 12px; }
.dest-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dest-name { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.dest-loc { font-size: 11.5px; color: var(--text-muted); }
.dest-badge {
  flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text-secondary); font-family: var(--font-mono); white-space: nowrap;
}
.preset-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Duel comparison */
.duel-compare { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin: 4px 0 12px; }
.duel-card {
  position: relative; width: 100%; border-radius: var(--radius-lg); border: none;
  background: var(--surface-3); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 16px 20px; text-align: center;
}
.duel-card.front {
  background: var(--surface-2); box-shadow: var(--shadow-md); cursor: grab; user-select: none;
  touch-action: pan-y; will-change: transform;
}
.duel-card.front:active { cursor: grabbing; }
.duel-card-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.duel-card svg { font-size: 24px; color: var(--text-secondary); }
.duel-card .name { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.duel-card .loc { font-size: 11.5px; color: var(--text-muted); }
.duel-vs {
  align-self: center; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-muted);
  background: var(--bg); padding: 2px 8px; border-radius: var(--radius-sm); margin: -2px 0;
}
.duel-stamp {
  position: absolute; top: 14px; padding: 5px 11px; border-radius: var(--radius-sm); font-size: 10.5px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.06em; opacity: 0; border: 1.5px solid; pointer-events: none;
}
.duel-stamp.right { right: 14px; color: var(--accent-strong); border-color: var(--accent); transform: rotate(8deg); }
.duel-stamp.left { left: 14px; color: var(--text-secondary); border-color: var(--text-muted); transform: rotate(-8deg); }
.duel-hint-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin: 0 0 16px; }
.duel-hint-row span { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
.duel-hint-row span > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duel-hint-row span:last-child { flex-direction: row-reverse; text-align: right; }
.duel-hint-row svg { font-size: 13px; flex-shrink: 0; }
.duel-actions { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 6px; }
.duel-btn {
  width: 46px; height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
}
.duel-btn svg { font-size: 19px; }
.duel-btn.like { border-color: var(--accent); color: var(--accent); }

/* Ranking list */
.rank-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px; background: var(--surface-2);
  border: none; box-shadow: var(--shadow-sm); border-radius: var(--radius-md); margin-bottom: 8px;
}
.rank-num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); color: var(--text-secondary);
  font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.rank-num.top { background: var(--gold); color: var(--on-gold); }
.rank-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; }
.rank-info svg { font-size: 15px; color: var(--text-muted); flex-shrink: 0; }
.rank-info .t-wrap { min-width: 0; }
.rank-info .t { font-family: var(--font-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-info .l { font-size: 11.5px; color: var(--text-muted); }
.rank-stars { display: flex; align-items: center; gap: 1px; flex-shrink: 0; margin-left: 8px; font-size: 13px; }
.star { position: relative; display: inline-flex; color: var(--border-soft); }
.star.full { color: var(--gold); }
.star-fill-half { position: absolute; inset: 0; width: 50%; overflow: hidden; color: var(--gold); }

/* Bottom nav — a floating, rounded-top bar per the mock's .navbar. */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: center;
}
.bottomnav-inner {
  max-width: 480px; width: 100%; display: flex;
  background: var(--surface-2); box-shadow: 0 -4px 16px rgba(35, 26, 19, 0.12);
  border-radius: 20px 20px 0 0; padding: 10px 4px calc(8px + env(safe-area-inset-bottom, 0px));
}
.navbtn {
  flex: 1; background: none; border: none; padding: 6px 0; display: flex; flex-direction: column;
  align-items: center; gap: 5px; color: var(--text-secondary); font-size: 10.5px; font-weight: 500;
}
.navbtn svg {
  width: 28px; height: 28px; border-radius: 9px; transition: background 0.1s ease, color 0.1s ease;
}
.navbtn.active { color: var(--accent-strong); }
.navbtn.active svg { background: var(--gold); color: var(--accent-strong); }

.toast {
  position: fixed; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px;
  font-weight: 600; z-index: 200; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

.stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.stat-card { flex: 1; background: var(--surface-2); border: none; box-shadow: var(--shadow-sm); border-radius: var(--radius-md); padding: 14px; text-align: center; }
.stat-card .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-card .l { font-size: 10.5px; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }

.error-text { color: var(--danger); font-size: 12px; margin-top: 5px; }

</style>

const TRAIL_ANCHORS = [

/* Sky rendered as discrete flat bands (a screen-printed sunset), not a

function skyBandRects(c) {

/* A cluster of angular pine silhouettes — the foreground band's treeline,
   framing the edges of the scene rather than covering it. */
function pineCluster(x, baseY, c, scale) {
  const s = scale || 1;
  return `<g fill="${c.near}">
    <polygon points="${x},${baseY} ${x - 14 * s},${baseY} ${x - 7 * s},${baseY - 34 * s}"/>
    <polygon points="${x + 22 * s},${baseY} ${x + 8 * s},${baseY} ${x + 15 * s},${baseY - 46 * s}"/>

function sunPoly(cx, cy, r, c) {

  return `<polygon points="${cx - k},${cy - r} ${cx + k},${cy - r} ${cx + r},${cy - k} ${cx + r},${cy + k} ${cx + k},${cy + r} ${cx - k},${cy + r} ${cx - r},${cy + k} ${cx - r},${cy - k}" fill="${c.sun}"/>`;

/* The recurring hiker sprite — a solid, rounded, game-sprite silhouette

function buildHikerSprite(x, y, scale) {

/* ---------- Hero canvas scene, ported from design/breeze-mock.html ----------

const SCENE_PALETTES = {

function heroHex(h) { h = h.replace('#', ''); return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)]; }
const HERO_BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function heroBayer(x, y) { return (HERO_BAYER[y & 3][x & 3] + 0.5) / 16; }
function heroNoise(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
function heroMix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function heroLerp(a, b, t) { return a + (b - a) * t; }
function heroRidgeY(pts, xf, H) {
  for (let i = 0; i < pts.length - 1; i++) {
    if (xf >= pts[i][0] && xf <= pts[i + 1][0]) {
      const t = (xf - pts[i][0]) / (pts[i + 1][0] - pts[i][0]);
      return heroLerp(pts[i][1], pts[i + 1][1], t) * H;
    }
  }
  return pts[pts.length - 1][1] * H;
}

function renderHeroCanvas(canvas) {
  const P = SCENE_PALETTES[getSeason()];
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const data = img.data;
  function px(x, y, rgb, a) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    const i = (y * W + x) * 4;
    data[i] = rgb[0]; data[i + 1] = rgb[1]; data[i + 2] = rgb[2]; data[i + 3] = a === undefined ? 255 : a;
  }

  // ---- sky bands + irregular hand-drawn horizon ----
  const skyH = Math.floor(H * 0.62);
  const stops = P.sky.map(heroHex);
  const segH = skyH / (stops.length - 1);
  const horizonBase = heroHex(P.horizon);
  function horizonOffset(x) {
    return 5 * (0.55 * Math.sin(x * 0.085 + 0.6) + 0.30 * Math.sin(x * 0.19 + 2.1) + 0.15 * Math.sin(x * 0.47 + 1.0));
  }
  for (let x = 0; x < W; x++) {
    const effBottom = skyH + Math.round(horizonOffset(x));
    for (let y = 0; y < H; y++) {
      if (y < effBottom) {
        const seg = Math.min(stops.length - 2, Math.floor(y / segH));
        const localT = (y - seg * segH) / segH;
        const jitter = (heroNoise(x * 0.6, y * 0.6) - 0.5) * 0.55;
        const tt = localT + jitter;
        const c = tt > 0.5 ? stops[seg + 1] : stops[seg];
        px(x, y, c, 255);
      } else {
        const edgeJ = heroNoise(x * 0.7, y * 0.7) > 0.86 ? heroMix(horizonBase, [0, 0, 0], 0.12) : horizonBase;
        px(x, y, edgeJ, 255);
      }
    }
  }

  // ---- sun + glow ----
  const sunX = Math.floor(W * 0.76), sunY = Math.floor(H * 0.14), sunR = Math.floor(H * 0.075);
  const sunCore = heroHex(P.sunCore), sunMid = heroHex(P.sunMid);
  for (let y2 = 0; y2 < skyH; y2++) {
    for (let x2 = 0; x2 < W; x2++) {
      const dx = x2 - sunX, dy = y2 - sunY, d = Math.sqrt(dx * dx + dy * dy);
      if (d < sunR) { px(x2, y2, d < sunR * 0.6 ? sunCore : sunMid, 255); }
      else if (d < sunR * 2.8) {
        const g = 1 - ((d - sunR) / (sunR * 1.8));
        if (g > 0 && heroNoise(x2 * 0.8, y2 * 0.8) < g * 0.75) { px(x2, y2, sunMid, 255); }
      }
    }
  }

  // ---- clouds: organic multi-lobe cumulus, lit toward the sun ----
  function drawCloud(spec) {
    const cx = spec.cx * W, cy = spec.cy * H, s = spec.scale * H;
    const lobes = spec.lobes.map(l => ({ x: cx + l[0] * s, y: cy + l[1] * s, r: l[2] * s }));
    let minX = W, maxX = 0, minY = H, maxY = 0;
    lobes.forEach(l => {
      minX = Math.min(minX, l.x - l.r); maxX = Math.max(maxX, l.x + l.r);
      minY = Math.min(minY, l.y - l.r); maxY = Math.max(maxY, l.y + l.r);
    });
    minX = Math.max(0, Math.floor(minX)); maxX = Math.min(W, Math.ceil(maxX));
    minY = Math.max(0, Math.floor(minY)); maxY = Math.min(H, Math.ceil(maxY));
    const sunSide = (sunX - cx) >= 0 ? 1 : -1;
    const warm = heroHex(spec.warm), mid = heroHex(spec.mid), shadow = heroHex(spec.shadow);
    const bh = (maxY - minY) || 1, bw = (maxX - minX) || 1;
    for (let yy = minY; yy < maxY; yy++) {
      for (let xx = minX; xx < maxX; xx++) {
        let inside = false;
        for (let i = 0; i < lobes.length; i++) {
          const l = lobes[i], dx = xx - l.x, dy = yy - l.y, dn = Math.sqrt(dx * dx + dy * dy) / l.r;
          if (dn < 1) { inside = true; break; }
        }
        if (!inside) continue;
        const vertT = 1 - (yy - minY) / bh;
        const horizT = ((xx - cx) / (bw * 0.5)) * sunSide;
        const jitter = (heroNoise(xx * 0.85 + cx * 3, yy * 0.85 + cy * 3) - 0.5) * 0.30;
        const tt = vertT * 0.62 + horizT * 0.22 + jitter - 0.28;
        const col = tt > 0.30 ? warm : (tt > 0.02 ? mid : shadow);
        px(xx, yy, col, 255);
      }
    }
  }
  const cloudLobesBig = [[0, 0, 1], [-1.05, 0.18, 0.78], [1.0, 0.12, 0.82], [-0.5, -0.4, 0.66], [0.55, -0.32, 0.68], [-1.75, 0.32, 0.5], [1.7, 0.28, 0.52], [0.1, 0.42, 0.62]];
  const cloudLobesSml = [[0, 0, 1], [-1, 0.15, 0.74], [0.95, 0.1, 0.78], [-0.5, -0.32, 0.6], [0.5, -0.28, 0.62], [1.55, 0.24, 0.48]];
  drawCloud(Object.assign({ cx: 0.17, cy: 0.19, scale: 0.135, lobes: cloudLobesBig }, P.clouds[0]));
  drawCloud(Object.assign({ cx: 0.58, cy: 0.235, scale: 0.09, lobes: cloudLobesSml }, P.clouds[1]));
  drawCloud(Object.assign({ cx: 0.79, cy: 0.24, scale: 0.125, lobes: cloudLobesBig }, P.clouds[2]));

  // ---- distant birds ----
  function drawBird(cx, cy, scale, color) {
    const c = heroHex(color);
    for (let d = 1; d <= scale; d++) {
      px(Math.floor(cx - d), Math.floor(cy - d), c, 255);
      px(Math.floor(cx + d), Math.floor(cy - d), c, 255);
    }
    px(Math.floor(cx), Math.floor(cy), c, 255);
  }
  drawBird(W * 0.365, H * 0.155, 3, P.bird);
  drawBird(W * 0.405, H * 0.19, 2, P.bird);
  drawBird(W * 0.685, H * 0.095, 3, P.bird);
  drawBird(W * 0.71, H * 0.125, 2, P.bird);

  // ---- foreground ground ----
  const groundPts = [[0, .90], [.15, .84], [.30, .90], [.45, .85], [.60, .92], [.75, .86], [.90, .91], [1, .87]];
  const groundBase = heroHex(P.ground.base), groundFleck = heroHex(P.ground.fleck);
  for (let x5 = 0; x5 < W; x5++) {
    const gy = heroRidgeY(groundPts, x5 / (W - 1), H);
    for (let y5 = Math.floor(gy); y5 < H; y5++) {
      const c5 = heroBayer(x5 * 7 + 1, y5 * 3 + 2) > 0.82 ? groundFleck : groundBase;
      px(x5, y5, c5, 255);
    }
  }

  // ---- pine trees: tiered, volumetric shading ----
  function drawPine(cx, baseY, h, warmC, midC, shadowC) {
    const warm = heroHex(warmC), mid = heroHex(midC), shadow = heroHex(shadowC);
    const sunSide = (sunX - cx) >= 0 ? 1 : -1;
    const tiers = 4, tierH = h * 0.30;
    for (let i = 0; i < tiers; i++) {
      const top = baseY - h + i * (tierH * 0.76);
      const widthMax = (h * 0.30) * (0.40 + 0.60 * (i / (tiers - 1)));
      for (let ty = 0; ty < tierH; ty++) {
        const y = Math.floor(top + ty);
        if (y < 0 || y >= H) continue;
        const rowFrac = ty / tierH;
        const halfw = Math.max(0.7, widthMax * rowFrac);
        for (let dx = -halfw; dx <= halfw; dx++) {
          const x = Math.floor(cx + dx);
          const nx = dx / (halfw || 1);
          const vert = 1 - rowFrac;
          const jitter = (heroNoise(x * 1.1 + cx * 2, y * 1.1) - 0.5) * 0.34;
          const tt = vert * 0.28 + (nx * sunSide) * 0.44 + jitter + 0.02;
          const c = tt > 0.34 ? warm : (tt > 0.00 ? mid : shadow);
          px(x, y, c, 255);
        }
      }
    }
    for (let yt = Math.floor(baseY - 3); yt < baseY + 2; yt++) { px(Math.floor(cx), yt, [38, 26, 17], 255); }
  }
  const pineSpots = [[0.05, 17, 1], [0.10, 24, 1], [0.16, 14, 0.9], [0.845, 15, 1], [0.895, 25, 1], [0.955, 13, 0.9]];
  for (let pt = 0; pt < pineSpots.length; pt++) {
    const pxFrac = pineSpots[pt][0], ph = pineSpots[pt][1];
    const pby = heroRidgeY(groundPts, pxFrac, H) + 5;
    drawPine(pxFrac * W, pby, ph, P.pine.warm, P.pine.mid, P.pine.shadow);
  }

  // ---- bushes ----
  function drawBush(cx, baseY, r, warmC, midC, shadowC) {
    const warm = heroHex(warmC), mid = heroHex(midC), shadow = heroHex(shadowC);
    const sunSide = (sunX - cx) >= 0 ? 1 : -1;
    const lobes = [[0, -0.2, 1], [-0.75, 0.05, 0.72], [0.75, 0.0, 0.75], [-0.2, -0.55, 0.6], [0.35, -0.5, 0.62]];
    const pts = lobes.map(l => ({ x: cx + l[0] * r, y: baseY + l[1] * r, r: l[2] * r }));
    let minX = W, maxX = 0, minY = H, maxY = 0;
    pts.forEach(l => { minX = Math.min(minX, l.x - l.r); maxX = Math.max(maxX, l.x + l.r); minY = Math.min(minY, l.y - l.r); maxY = Math.max(maxY, l.y + l.r); });
    minX = Math.max(0, Math.floor(minX)); maxX = Math.min(W, Math.ceil(maxX));
    minY = Math.max(0, Math.floor(minY)); maxY = Math.min(H, Math.ceil(maxY));
    const bh = (maxY - minY) || 1;
    for (let yy = minY; yy < maxY; yy++) {
      for (let xx = minX; xx < maxX; xx++) {
        let inside = false;
        for (let i = 0; i < pts.length; i++) { const l = pts[i], dx = xx - l.x, dy = yy - l.y, dn = Math.sqrt(dx * dx + dy * dy) / l.r; if (dn < 1) { inside = true; break; } }
        if (!inside) continue;
        const vertT = 1 - (yy - minY) / bh;
        const horizT = ((xx - cx) / r) * sunSide;
        const jitter = (heroNoise(xx * 1.3 + cx, yy * 1.3) - 0.5) * 0.32;
        const tt = vertT * 0.42 + horizT * 0.4 + jitter - 0.10;
        const c = tt > 0.36 ? warm : (tt > 0.02 ? mid : shadow);
        px(xx, yy, c, 255);
      }
    }
  }
  const bushSpots = [[0.225, 5.5, 0.755], [0.27, 4, 0.795], [0.335, 3.8, 0.735], [0.665, 4, 0.735], [0.725, 5, 0.795], [0.775, 3.8, 0.755]];
  for (let bt = 0; bt < bushSpots.length; bt++) {
    const bxFrac = bushSpots[bt][0], br = bushSpots[bt][1], byFrac = bushSpots[bt][2];
    drawBush(bxFrac * W, byFrac * H, br, P.bush.warm, P.bush.mid, P.bush.shadow);
  }

  // ---- riverside rocks ----
  function drawRock(cx, baseY, r, litC, midC, shadeC) {
    const lit = heroHex(litC), mid = heroHex(midC), shade = heroHex(shadeC);
    const sunSide = (sunX - cx) >= 0 ? 1 : -1;
    for (let yy = Math.floor(baseY - r * 1.3); yy <= baseY; yy++) {
      const rowT = (baseY - yy) / (r * 1.3);
      const halfw = r * Math.sqrt(Math.max(0, 1 - Math.pow(1 - rowT, 2)));
      for (let dx = -halfw; dx <= halfw; dx++) {
        const x = Math.floor(cx + dx);
        const nx = dx / (halfw || 1);
        const jitter = (heroNoise(x * 1.4 + cx, yy * 1.4) - 0.5) * 0.3;
        const tt = rowT * 0.35 + (nx * sunSide) * 0.5 + jitter + 0.05;
        const c = tt > 0.42 ? lit : (tt > 0.05 ? mid : shade);
        px(x, Math.floor(yy), c, 255);
      }
    }
  }
  drawRock(W * 0.345, H * 0.80, 3.4, P.rock.lit, P.rock.mid, P.rock.shade);
  drawRock(W * 0.635, H * 0.795, 2.8, P.rock.lit, P.rock.mid, P.rock.shade);

  // ---- river: recedes to a vanishing point at the horizon, drawn on top of
  // the meadow so it visibly carves through it ----
  const riverPts = [[0.50, 0.64], [0.48, 0.70], [0.535, 0.775], [0.485, 0.85], [0.52, 0.92], [0.495, 1.0]];
  const riverWarm = heroHex(P.river.warm), riverMid = heroHex(P.river.mid), riverShadow = heroHex(P.river.shadow);
  const riverTop = riverPts[0][1];
  for (let y6 = Math.floor(H * riverTop); y6 < H; y6++) {
    const yf = y6 / H;
    let cx6 = W * 0.5;
    for (let i2 = 0; i2 < riverPts.length - 1; i2++) {
      const y0 = riverPts[i2][1], y1 = riverPts[i2 + 1][1];
      if (yf >= y0 && yf <= y1) {
        const tt = (yf - y0) / (y1 - y0 + 0.0001);
        cx6 = heroLerp(riverPts[i2][0], riverPts[i2 + 1][0], tt) * W;
        break;
      }
    }
    const progress = Math.pow((yf - riverTop) / (1 - riverTop), 1.5);
    const halfw = Math.max(1.5, H * (0.012 + 0.30 * progress));
    const horizBias = 1 - Math.min(1, Math.abs(cx6 - sunX) / (W * 0.6));
    for (let xw = -halfw; xw <= halfw; xw++) {
      const xx6 = Math.floor(cx6 + xw);
      const distT = Math.abs(xw) / halfw;
      const jitter = (heroNoise(xx6 * 0.9, y6 * 0.9) - 0.5) * 0.30;
      const tt2 = (1 - distT) * 0.60 + horizBias * 0.24 + jitter - 0.24;
      let c6 = tt2 > 0.38 ? riverWarm : (tt2 > 0.08 ? riverMid : riverShadow);
      if (distT > 0.86) c6 = heroMix(riverShadow, [0, 0, 0], 0.25);
      px(xx6, y6, c6, 255);
    }
  }

  // ---- fade the ground into the page's paper tone at the bottom edge, so
  // the hero dissolves into the content sheet instead of cutting off ----
  const paperC = heroHex('#ecdbb2');
  const fadeRows = Math.floor(H * 0.20);
  for (let yf2 = H - fadeRows; yf2 < H; yf2++) {
    const ft = Math.pow((yf2 - (H - fadeRows)) / fadeRows, 1.3);
    for (let xf2 = 0; xf2 < W; xf2++) {
      const idx = (yf2 * W + xf2) * 4;
      const cur = [data[idx], data[idx + 1], data[idx + 2]];
      const blended = heroMix(cur, paperC, Math.min(1, ft + (heroBayer(xf2, yf2) - 0.5) * 0.18));
      data[idx] = blended[0]; data[idx + 1] = blended[1]; data[idx + 2] = blended[2];
    }
  }

  ctx.putImageData(img, 0, 0);
}

/* Tileable dithered "paper" texture for the scrolling content sheet's
   background, ported from the mock's --bg-tile trick. */
function buildPaperTile() {
  const tile = document.createElement('canvas');
  tile.width = 16; tile.height = 16;
  const tctx = tile.getContext('2d');
  const timg = tctx.createImageData(16, 16);
  const pA = heroHex('#eeddb4'), pB = heroHex('#dfc48c');
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const i = (y * 16 + x) * 4;
      const c = heroBayer(x, y) > 0.5 ? pA : pB;
      const noisy = Math.random() < 0.12 ? heroMix(c, [0, 0, 0], 0.05) : c;
      timg.data[i] = noisy[0]; timg.data[i + 1] = noisy[1]; timg.data[i + 2] = noisy[2]; timg.data[i + 3] = 255;
    }
  }
  tctx.putImageData(timg, 0, 0);
  return tile.toDataURL();
}
const TRAIL_HIKER_ICON = '<svg width="12" height="14" viewBox="0 0 6 7"><rect x="2" y="0" width="2" height="2" fill="#231a13"/><rect x="1" y="2" width="4" height="2" fill="#c1502c"/><rect x="1" y="4" width="1" height="3" fill="#231a13"/><rect x="4" y="4" width="1" height="3" fill="#231a13"/></svg>';

function typeInfo(id) { return TYPES.find(t => t.id === id) || TYPES[TYPES.length - 1]; }
function colorForId(id) {
  let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_TONES[h % AVATAR_TONES.length];
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
}
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function escapeHtml(str) {
  const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML;
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function generateCode() {
  let s = '';
  for (let i = 0; i < 6; i++) s += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
  return s;
}
async function generateUniqueCode() {

      const snap = await db.collection('users').where('code', '==', code).limit(1).get();

  }

}

function syncFriendSubscriptions() {
  const friends = currentUser.friends || [];
  friends.forEach(fid => {
    if (friendUnsubs[fid]) return;
    try {
      friendUnsubs[fid] = db.doc('users/' + fid).onSnapshot((snap) => {
        const data = snap && snap.data ? snap.data() : snap;
        if (data) { friendDocs[fid] = normalizeUser(fid, data); renderScreen(); }
      });
    } catch (e) {}
  });
  Object.keys(friendUnsubs).forEach(fid => {
    if (!friends.includes(fid)) {
      try { friendUnsubs[fid](); } catch (e) {}
      delete friendUnsubs[fid];
      delete friendDocs[fid];
    }
  });
}

function subscribeAll() {
  try {
    const userUnsub = db.doc('users/' + currentUser.id).onSnapshot((snap) => {
      const data = snap && snap.data ? snap.data() : snap;
      if (data) {
        const prevFriends = (currentUser.friends || []).join(',');
        currentUser = normalizeUser(currentUser.id, data);
        syncFriendSubscriptions();
        const friendsChanged = prevFriends !== (currentUser.friends || []).join(',');
        if (friendsChanged || currentTab === 'rankings' || currentTab === 'saved' || currentTab === 'summit') renderScreen();
        else updateFeedRankBadges();
      }
    });
    if (userUnsub) unsubFns.push(userUnsub);
  } catch (e) {}

  try {
    const q = db.collection('activities').orderBy('timestamp', 'desc').limit(200);
    const actUnsub = q.onSnapshot((snap) => {
      const docs = snap && snap.docs ? snap.docs : [];
      activitiesMap = {};
      activitiesOrder = [];
      docs.forEach(d => {
        const data = d.data ? d.data() : d;
        const id = d.id || data.id;
        activitiesMap[id] = { id, ...data };
        activitiesOrder.push(id);
        if (data.userId && !usersMap[data.userId]) {
          usersMap[data.userId] = { name: data.userName, color: data.userColor };
        }
      });
      if (currentTab === 'feed' || currentTab === 'saved' || currentTab === 'rankings' || currentTab === 'summit') renderScreen();
    });
    if (actUnsub) unsubFns.push(actUnsub);
  } catch (e) {}
}

async function addFriendByCode(overlay) {
  const input = document.getElementById('friendCodeInput');
  const err = document.getElementById('friendError');
  const code = input.value.trim().toUpperCase();
  err.hidden = true;
  if (!code) { err.textContent = 'Enter a code'; err.hidden = false; return; }
  try {
    const snap = await db.collection('users').where('code', '==', code).limit(1).get();
    const docs = snap && snap.docs ? snap.docs : [];
    if (!docs.length) { err.textContent = "No one found with that code"; err.hidden = false; return; }
    const targetDoc = docs[0];
    const targetId = targetDoc.id;
    const targetData = targetDoc.data() || {};
    if (targetId === currentUser.id) { err.textContent = "That's your own code"; err.hidden = false; return; }
    if ((currentUser.friends || []).includes(targetId)) { err.textContent = 'Already friends'; err.hidden = false; return; }
    const newMine = Array.from(new Set([...(currentUser.friends || []), targetId]));
    const newTheirs = Array.from(new Set([...(Array.isArray(targetData.friends) ? targetData.friends : []), currentUser.id]));
    await db.doc('users/' + currentUser.id).update({ friends: newMine });
    await db.doc('users/' + targetId).update({ friends: newTheirs });
    currentUser.friends = newMine;
    syncFriendSubscriptions();
    toast('Added ' + (targetData.name || 'friend'));
    overlay.remove();
    openFriendsSheet();
  } catch (e) {
    err.textContent = "Couldn't add that friend — try again";
    err.hidden = false;
  }
}

async function removeFriend(fid, overlay) {
  const newMine = (currentUser.friends || []).filter(id => id !== fid);
  currentUser.friends = newMine;
  try { await db.doc('users/' + currentUser.id).update({ friends: newMine }); } catch (e) {}
  try {
    const fd = friendDocs[fid];
    if (fd) {
      const theirFriends = (fd.friends || []).filter(id => id !== currentUser.id);
      await db.doc('users/' + fid).update({ friends: theirFriends });
    }
  } catch (e) {}
  syncFriendSubscriptions();
  overlay.remove();
  openFriendsSheet();
}

/* ---------- Summit (gamified mountain) ---------- */
function normalizeText(s) { return (s || '').toLowerCase().trim(); }

function locationsMatch(a, b) {
  const na = normalizeText(a), nb = normalizeText(b);
  if (!na || !nb) return false;
  return na === nb || na.includes(nb) || nb.includes(na);
}

function matchPreset(regionText) {
  const t = normalizeText(regionText);
  if (!t) return null;
  return REGION_PRESETS.find(p => p.matchTokens.some(tok => t.includes(tok))) || null;
}

function discoverRealDestinations(filterFn) {
  const groups = {};
  activitiesOrder.forEach(id => {
    const a = activitiesMap[id];
    if (!a || !a.location) return;
    if (filterFn && !filterFn(a)) return;
    const key = normalizeText(a.location);
    if (!key) return;
    if (!groups[key]) groups[key] = { location: a.location, count: 0 };
    groups[key].count++;
  });
  return Object.values(groups).sort((x, y) => y.count - x.count);
}

function buildDestinationList(regionText, everywhere) {
  if (everywhere) {
    const real = discoverRealDestinations(null).slice(0, 25);
    return { label: 'Everywhere', items: real.map(r => ({ name: r.location, location: r.location, count: r.count, seeded: false })) };
  }
  const preset = matchPreset(regionText);
  if (preset) {
    const seededItems = preset.destinations.map(d => ({
      name: d.name, location: d.location, seeded: true,
      count: discoverRealDestinations(a => locationsMatch(a.location, d.location)).reduce((s, g) => s + g.count, 0),
    }));
    const coveredKeys = new Set(seededItems.map(d => normalizeText(d.location)));
    const extra = discoverRealDestinations(a => preset.matchTokens.some(tok => normalizeText(a.location).includes(tok)) && !coveredKeys.has(normalizeText(a.location)))
      .map(r => ({ name: r.location, location: r.location, count: r.count, seeded: false }));
    const combined = seededItems.concat(extra).sort((x, y) => y.count - x.count).slice(0, 25);
    return { label: preset.label, items: combined };
  }
  const real = regionText
    ? discoverRealDestinations(a => locationsMatch(a.location, regionText)).map(r => ({ name: r.location, location: r.location, count: r.count, seeded: false }))
    : [];
  const combined = real.concat(GENERIC_PROMPTS).slice(0, 25);
  return { label: regionText || 'your region', items: combined };
}

function computeClimbStats(items) {
  const matchable = items.filter(it => it.location);
  const myPhotos = activitiesOrder
    .map(id => activitiesMap[id])
    .filter(a => a && a.userId === currentUser.id && a.photoUrl);
  let qualifyingCount = 0;
  const completed = new Set();
  myPhotos.forEach(a => {
    matchable.forEach(it => {
      if (locationsMatch(a.location, it.location)) {
        qualifyingCount++;
        completed.add(normalizeText(it.location));
      }
    });
  });
  const total = items.length || 1;
  return { qualifyingCount, completed, total, fraction: Math.min(1, qualifyingCount / total) };
}

function getSeason() {
  const m = new Date().getMonth();
  if (m === 11 || m === 0 || m === 1) return 'winter';
  if (m >= 2 && m <= 4) return 'spring';
  if (m >= 5 && m <= 7) return 'summer';
  return 'fall';
}

function pointAtFraction(frac) {
  frac = Math.max(0, Math.min(1, frac));
  const segCount = TRAIL_ANCHORS.length - 1;
  const pos = frac * segCount;
  const i = Math.min(segCount - 1, Math.floor(pos));
  const t = pos - i;
  const a = TRAIL_ANCHORS[i], b = TRAIL_ANCHORS[i + 1];
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function buildMountainSvg(season, fraction) {
  const c = SEASONS[season];
  const p = pointAtFraction(fraction);
  const trailPts = TRAIL_ANCHORS.map(pt => pt.x + ',' + pt.y).join(' ');
  const flag = fraction >= 1
    ? `<g transform="translate(158,30)"><rect x="0" y="0" width="2.4" height="20" rx="1" fill="${FIGURE_COLOR}"/><polygon points="2.4,0 13,3.5 2.4,7" fill="${FLAG_COLOR}"/></g>`
    : '';
  return `
  <svg viewBox="0 0 400 240" role="img" aria-label="Mountain progress" shape-rendering="crispEdges">
    ${skyBandRects(c)}
    ${sunPoly(320, 55, 22, c)}
    ${farRidgePoly(c)}
    ${midRidgePoly(c)}
    <rect x="141" y="82" width="9" height="9" fill="${c.snow}"/>
    <rect x="130" y="91" width="9" height="9" fill="${c.snow}"/>
    <rect x="152" y="91" width="9" height="9" fill="${c.snow}"/>
    <polyline points="${trailPts}" fill="none" stroke="${c.trail}" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="butt"/>
    ${foregroundBand(c, 205)}
    ${buildHikerSprite(p.x, p.y, 0.6)}
    ${flag}
  </svg>`;
}

/* Star rating is derived purely from position in the ranked list (best = index 0),
   never stored — so it always reflects the current order and list length,
   recalculating automatically whenever an activity is added, re-ranked, or removed. */
function computeStarRating(index, total) {
  if (total <= 1) return 5;
  const raw = 5 - 4 * (index / (total - 1)); // linear: rank #1 -> 5 stars, last place -> 1 star
  return Math.round(raw * 2) / 2; // snap to the nearest half-star
}

function starRatingHtml(rating) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  let html = `<span class="rank-stars" title="${rating.toFixed(1)} / 5">`;
  for (let i = 0; i < full; i++) html += `<span class="star full">${ICONS.starFilled}</span>`;
  if (half) html += `<span class="star half">${ICONS.star}<span class="star-fill-half">${ICONS.starFilled}</span></span>`;
  for (let i = 0; i < empty; i++) html += `<span class="star empty">${ICONS.star}</span>`;
  html += '</span>';
  return html;
}

function rankRowHtml(a, i, total) {
  const ti = typeInfo(a.type);
  const rating = computeStarRating(i, total);
  return `
    <div class="rank-row">
      <div class="rank-num ${i===0?'top':''}">${i+1}</div>
      <div class="rank-info">
        ${ICONS[ti.icon]}
        <div class="t-wrap">
          <div class="t">${escapeHtml(a.title)}</div>

        </div>

    </div>`;
}

/* ---------- Comparative ranking flow (swipeable duel) ---------- */
let rankSession = null;
let isSubmittingActivity = false;

function startRankingFlow() {
  isSubmittingActivity = false;
  const list = currentUser.rankedList.filter(id => activitiesMap[id]);
  if (list.length === 0) { finalizeNewActivity(0); return; }
  rankSession = { lo: 0, hi: list.length, list, totalSteps: Math.ceil(Math.log2(list.length + 1)) || 1, step: 0 };
  showComparisonStep();
}

function showComparisonStep() {
  const { lo, hi, list } = rankSession;
  if (lo >= hi) { finalizeNewActivity(lo); return; }
  const mid = Math.floor((lo + hi) / 2);
  const otherId = list[mid];
  const other = activitiesMap[otherId];
  const newTi = typeInfo(logState.type);
  const otherTi = typeInfo(other.type);
  rankSession.step++;
  const pct = Math.min(100, Math.round((rankSession.step / (rankSession.totalSteps + 1)) * 100));

  const overlay = document.createElement('div');
  overlay.className = 'overlay center';
  overlay.id = 'rankOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Which did you enjoy more?</div>
      <div class="modal-sub">Both are shown below — drag or tap the one you liked more</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="duel-compare">
        <div class="duel-card ref">
          <span class="duel-card-label">Already ranked</span>
          ${ICONS[otherTi.icon]}
          <span class="name">${escapeHtml(other.title)}</span>
          <span class="loc">${escapeHtml(other.location || '')}</span>
        </div>
        <span class="duel-vs">VS</span>
        <div class="duel-card front" id="duelFront">
          <div class="duel-stamp right" id="stampRight">Prefer this</div>
          <div class="duel-stamp left" id="stampLeft">Prefer that</div>
          <span class="duel-card-label">Just logged</span>
          ${ICONS[newTi.icon]}
          <span class="name">${escapeHtml(logState.title)}</span>
          <span class="loc">${escapeHtml(logState.location || 'New activity')}</span>
        </div>
      </div>
      <div class="duel-hint-row">
        <span>${ICONS.arrowLeft}<span>${escapeHtml(other.title)}</span></span>
        <span>${ICONS.arrowRight}<span>${escapeHtml(logState.title)}</span></span>
      </div>
      <div class="duel-actions">
        <button class="duel-btn" id="duelLeftBtn" title="Prefer ${escapeHtml(other.title)}">${ICONS.arrowLeft}</button>
        <button class="duel-btn like" id="duelRightBtn" title="Prefer ${escapeHtml(logState.title)}">${ICONS.arrowRight}</button>
      </div>
      <button class="btn-ghost" id="skipRank" style="display:block; margin: 4px auto 0;">Not sure — put it in the middle</button>
    </div>`;
  document.body.appendChild(overlay);

  const front = document.getElementById('duelFront');
  const stampRight = document.getElementById('stampRight');
  const stampLeft = document.getElementById('stampLeft');
  const threshold = 90;
  let dx = 0, dragging = false, pointerId = null, startX = 0, settled = false;

  function setTransform(x, animate) {
    front.style.transition = animate ? 'transform 0.25s ease' : 'none';
    front.style.transform = 'translateX(' + x + 'px) rotate(' + (x / 18) + 'deg)';
    const p = Math.max(-1, Math.min(1, x / threshold));
    stampRight.style.opacity = String(Math.max(0, p));
    stampLeft.style.opacity = String(Math.max(0, -p));
  }

  // Locking the overlay the instant a choice is made closes the race that caused
  // double-logging: without this, the ~200ms fly-out animation left every control
  // (arrows, "not sure") still clickable, so a second tap during that window fired
  // a second, independent finalizeNewActivity() call.
  function lockOverlay() {
    overlay.style.pointerEvents = 'none';
  }

  function commit(direction) {
    if (settled) return;
    settled = true;
    lockOverlay();
    front.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    front.style.transform = 'translateX(' + (direction * 500) + 'px) rotate(' + (direction * 20) + 'deg)';
    front.style.opacity = '0';
    setTimeout(() => {
      overlay.remove();
      if (direction > 0) { rankSession.hi = mid; } else { rankSession.lo = mid + 1; }
      showComparisonStep();
    }, 180);
  }

  front.addEventListener('pointerdown', (e) => {
    if (settled) return;
    dragging = true; pointerId = e.pointerId; startX = e.clientX;
    try { front.setPointerCapture(pointerId); } catch (err) {}
  });
  front.addEventListener('pointermove', (e) => {
    if (!dragging || settled) return;
    dx = e.clientX - startX;
    setTransform(dx, false);
  });
  function endDrag() {
    if (!dragging || settled) return;
    dragging = false;
    if (dx > threshold) commit(1);
    else if (dx < -threshold) commit(-1);
    else setTransform(0, true);
    dx = 0;
  }
  front.addEventListener('pointerup', endDrag);
  front.addEventListener('pointercancel', endDrag);

  document.getElementById('duelLeftBtn').addEventListener('click', () => commit(-1));
  document.getElementById('duelRightBtn').addEventListener('click', () => commit(1));
  document.getElementById('skipRank').addEventListener('click', () => {
    if (settled) return;
    settled = true;
    lockOverlay();
    overlay.remove();
    finalizeNewActivity(mid);
  });
}

async function finalizeNewActivity(insertIndex) {
  if (isSubmittingActivity) return;
  isSubmittingActivity = true;
  const id = uid();
  let photoUrl = null;
  if (pendingPhoto && assets) {
    try {
      toast('Uploading photo…');
      const res = await assets.upload(pendingPhoto);
      photoUrl = res && res.url;
    } catch (e) { /* continue without photo */ }
  }
  const data = {
    userId: currentUser.id,
    userName: currentUser.name,
    userColor: currentUser.color,
    type: logState.type,
    title: logState.title,
    location: logState.location,
    review: logState.review,
    photoUrl: photoUrl,
    timestamp: Date.now(),
  };
  try { await db.doc('activities/' + id).set(data); } catch (e) { toast('Could not save activity — try again'); isSubmittingActivity = false; return; }

  const newList = currentUser.rankedList.filter(x => activitiesMap[x]);
  newList.splice(insertIndex, 0, id);
  currentUser.rankedList = newList;
  try { await db.doc('users/' + currentUser.id).update({ rankedList: newList }); } catch (e) {}

  activitiesMap[id] = { id, ...data };
  activitiesOrder.unshift(id);

  toast('Added! Ranked #' + (insertIndex + 1) + ' of ' + newList.length);
  currentTab = 'rankings';
  renderScreen();
  isSubmittingActivity = false;
}

init();
</script>
</body>
</html>
