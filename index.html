<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Breeze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,600;1,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6f0;
  --surface: #ffffff;
  --surface-2: #f2ece2;
  --surface-3: #e8ded0;
  --border: #e3d9c9;
  --text: #2b2a22;
  --text-secondary: #6b6255;
  --text-muted: #a79c8c;
  --accent: #5f7d54;
  --accent-strong: #46603b;
  --accent-soft: rgba(95, 125, 84, 0.12);
  --on-accent: #ffffff;
  --gold: #c9a13f;
  --gold-soft: rgba(201, 161, 63, 0.18);
  --on-gold: #2b2a22;
  --danger: #b5533f;
  --danger-soft: rgba(181, 83, 63, 0.12);
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(43, 42, 34, 0.06);
  --shadow-md: 0 8px 24px rgba(43, 42, 34, 0.08);
  --font-sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  font-size: 15px; line-height: 1.45;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 84px; }
img { max-width: 100%; display: block; }
button { font-family: var(--font-sans); cursor: pointer; }
input, textarea, select { font-family: var(--font-sans); }
[hidden] { display: none !important; }
svg { width: 1em; height: 1em; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand {
  font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 22px;
  letter-spacing: -0.01em; color: var(--accent);
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.log-btn {
  display: flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent);
  border: none; padding: 8px 14px 8px 11px; border-radius: 999px; font-weight: 700; font-size: 13px;
}
.log-btn svg { font-size: 15px; }
.log-btn:active { background: var(--accent-strong); }
.avatar-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none; color: #fff;
  font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.02em;
}

/* Onboarding */
.onboard-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px; text-align: center;
}
.onboard-mark {
  width: 52px; height: 52px; border-radius: var(--radius-lg); background: var(--accent-soft);
  color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 22px;
}
.onboard-wrap h1 {
  font-family: var(--font-display); font-style: italic; font-weight: 700; color: var(--accent);
  font-size: 34px; margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance;
}
.onboard-wrap p { color: var(--text-secondary); font-size: 14.5px; line-height: 1.55; margin: 0 0 30px; max-width: 320px; text-wrap: balance; }
.onboard-form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }

.field-input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 14.5px; outline: none;
}
.field-input:focus { border-color: var(--accent); }
textarea.field-input { resize: none; font-size: 14.5px; }

.btn-primary {
  background: var(--accent); color: var(--on-accent); border: none; padding: 13px 20px; border-radius: var(--radius-md);
  font-weight: 700; font-size: 14.5px; width: 100%;
}
.btn-primary:active { background: var(--accent-strong); }
.btn-primary:disabled { opacity: 0.5; }
.btn-secondary {
  background: var(--surface); color: var(--text); border: 1.5px solid var(--border);
  padding: 11px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 13.5px;
}
.btn-ghost {
  background: transparent; border: none; color: var(--text-secondary); font-size: 12.5px; font-weight: 600;
  padding: 6px;
}
.btn-ghost:hover { color: var(--text); }

/* Main content */
.screen { flex: 1; padding: 4px 20px 20px; }
.screen-title {
  font-family: var(--font-display); font-weight: 600; font-size: 25px; margin: 4px 0 4px;
  letter-spacing: -0.01em; text-wrap: balance;
}
.screen-sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 18px; }

.chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600;
  color: var(--text-secondary); white-space: nowrap;
}
.chip svg { font-size: 13px; }
.chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Activity card */
.card {
  background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border);
  margin-bottom: 14px; overflow: hidden;
}
.card-photo { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--surface-2); }
.card-body { padding: 14px 16px 15px; }
.card-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.mini-avatar {
  width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.card-user-name { font-weight: 700; font-size: 13px; }
.card-time { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.card-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.card-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.card-loc { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 9px; }
.card-loc svg { font-size: 13px; color: var(--text-muted); }
.card-review { font-size: 13.5px; color: var(--text); line-height: 1.55; margin-bottom: 11px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.rank-badge {
  display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 4px 10px 4px 8px;
  border-radius: 999px; background: var(--surface-2); color: var(--text-secondary);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.rank-badge svg { font-size: 12px; }
.rank-badge.empty { background: none; padding: 4px 0; font-family: var(--font-sans); }
.save-btn {
  background: none; border: none; padding: 4px; color: var(--text-muted); font-size: 19px;
  display: flex; align-items: center;
}
.save-btn.saved { color: var(--accent); }
.type-tag {
  display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px;
  border-radius: 999px; background: var(--surface-2); color: var(--text-secondary);
}
.type-tag svg { font-size: 12.5px; }

.empty-state { text-align: center; padding: 56px 20px; color: var(--text-muted); }
.empty-state .icon-wrap {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 14px;
}
.empty-state p { font-size: 13.5px; margin: 0; max-width: 240px; margin-inline: auto; line-height: 1.5; }

/* Log form */
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; display: block;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.type-opt {
  padding: 12px 4px 10px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: var(--text-secondary);
}
.type-opt.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.type-opt svg { font-size: 19px; }
.photo-upload {
  border: 1.5px dashed var(--border); border-radius: var(--radius-md); padding: 18px; text-align: center;
  color: var(--text-muted); font-size: 12.5px; position: relative; cursor: pointer;
}
.photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-preview { width: 100%; border-radius: var(--radius-md); margin-top: 10px; max-height: 190px; object-fit: cover; }

/* Overlay / modal */
.overlay {
  position: fixed; inset: 0; background: rgba(30, 27, 20, 0.5); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
}
.overlay.center { align-items: center; padding: 20px; }
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border: 1px solid var(--border); border-bottom: none;
}
.overlay.center .modal { border-radius: 18px; border-bottom: 1px solid var(--border); }
.modal-title {
  font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 4px;
  text-align: center; letter-spacing: -0.01em;
}
.modal-sub { font-size: 12.5px; color: var(--text-secondary); text-align: center; margin: 0 0 20px; }
.vs-row { display: flex; gap: 10px; margin-bottom: 14px; }
.vs-card {
  flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 16px 10px; text-align: center;
  background: var(--surface-2); display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--text);
}
.vs-card svg { font-size: 22px; color: var(--text-secondary); }
.vs-card:active { border-color: var(--accent); background: var(--accent-soft); }
.vs-card .name { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; }
.vs-card .loc { font-size: 11px; color: var(--text-muted); }
.vs-divider {
  font-size: 10.5px; color: var(--text-muted); text-align: center; margin: 2px 0 14px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.progress-bar { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 18px; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }

/* Ranking list */
.rank-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px;
}
.rank-num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--text-secondary);
  font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-family: var(--font-mono);
}
.rank-num.top { background: var(--gold); color: var(--on-gold); }
.rank-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; }
.rank-info svg { font-size: 15px; color: var(--text-muted); flex-shrink: 0; }
.rank-info .t-wrap { min-width: 0; }
.rank-info .t { font-family: var(--font-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-info .l { font-size: 11.5px; color: var(--text-muted); }

/* Bottom nav */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex; justify-content: center;
}
.bottomnav-inner { max-width: 480px; width: 100%; display: flex; }
.navbtn {
  flex: 1; background: none; border: none; padding: 11px 4px 9px; display: flex; flex-direction: column;
  align-items: center; gap: 4px; color: var(--text-muted); font-size: 10.5px; font-weight: 700;
  border-top: 2px solid transparent; margin-top: -1px;
}
.navbtn svg { font-size: 19px; }
.navbtn.active { color: var(--accent); border-top-color: var(--accent); }

.toast {
  position: fixed; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px;
  font-weight: 600; z-index: 200; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

.stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; text-align: center; }
.stat-card .n { font-size: 21px; font-weight: 800; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stat-card .l { font-size: 10.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

.error-text { color: var(--danger); font-size: 12px; margin-top: 5px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
function svgIcon(paths) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}
const ICONS = {
  home: svgIcon('<path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H9v-6h6v6h2.5a1 1 0 0 0 1-1V9.5"/>'),
  ranks: svgIcon('<path d="M4 20V12"/><path d="M10 20V8"/><path d="M16 20V4"/>'),
  saved: svgIcon('<path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/>'),
  savedFilled: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>',
  plus: svgIcon('<path d="M12 5v14M5 12h14"/>'),
  pin: svgIcon('<path d="M12 21s7-6.7 7-11.5A7 7 0 0 0 5 9.5C5 14.3 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/>'),
  hike: svgIcon('<path d="M3 19h18L14.5 7 11 13l-2-2.3L3 19z"/>'),
  lookout: svgIcon('<circle cx="12" cy="12" r="8.3"/><path d="M15 9l-1.8 4.2L9 15l1.8-4.2L15 9z"/>'),
  walk: svgIcon('<path d="M4 17c2.3-.8 2.9-3 4.9-3s2.6 2.2 4.9 2.2 2.6-2.2 4.9-3"/>'),
  kayak: svgIcon('<path d="M2.5 13.5c3.2 3 6.8 4 9.5 4s6.3-1 9.5-4c-2.4 4.6-6 7.4-9.5 7.4s-7.1-2.8-9.5-7.4z"/><path d="M5.5 6.5l5.3 5.3M18.5 17.5l-5.3-5.3"/>'),
  camp: svgIcon('<path d="M4 19.5 12 6l8 13.5"/><path d="M8.8 19.5 12 14l3.2 5.5"/>'),
  bike: svgIcon('<circle cx="5.5" cy="17" r="3"/><circle cx="18.5" cy="17" r="3"/><path d="M5.5 17 9.5 9h4.5l3 8M9.5 9 8 6.2h2.6"/>'),
  swim: svgIcon('<path d="M2.5 15.3c1.4-1.4 2.8-1.4 4.2 0s2.8 1.4 4.2 0 2.8-1.4 4.2 0 2.8 1.4 4.2 0"/><path d="M2.5 11c1.4-1.4 2.8-1.4 4.2 0s2.8 1.4 4.2 0 2.8-1.4 4.2 0 2.8 1.4 4.2 0"/>'),
  other: svgIcon('<path d="M12 4v16M5 8l14 8M19 8 5 16"/>'),
};

const TYPES = [
  { id: 'hike', label: 'Hike', icon: 'hike' },
  { id: 'lookout', label: 'Lookout', icon: 'lookout' },
  { id: 'walk', label: 'Walk', icon: 'walk' },
  { id: 'kayak', label: 'Kayak', icon: 'kayak' },
  { id: 'camp', label: 'Camp', icon: 'camp' },
  { id: 'bike', label: 'Bike', icon: 'bike' },
  { id: 'swim', label: 'Swim', icon: 'swim' },
  { id: 'other', label: 'Other', icon: 'other' },
];
const AVATAR_TONES = ['#c07d5f', '#5f7d54', '#5f7f91', '#b98b34', '#818c5a', '#a9727a'];

function typeInfo(id) { return TYPES.find(t => t.id === id) || TYPES[TYPES.length - 1]; }
function colorForId(id) {
  let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_TONES[h % AVATAR_TONES.length];
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
}
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function escapeHtml(str) {
  const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML;
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

let db = null, assets = null;
let currentUser = null; // {id, name, color, rankedList, bucketList}
let activitiesMap = {};   // id -> activity data
let activitiesOrder = []; // ids sorted by timestamp desc
let usersMap = {};        // id -> {name,color}
let currentTab = 'feed';
let feedFilter = 'all';
let pendingPhoto = null;
let unsubFns = [];

const app = document.getElementById('app');

function toast(msg) {
  let el = document.getElementById('toastEl');
  if (!el) { el = document.createElement('div'); el.id = 'toastEl'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function readStoredUserId() {
  try {
    const id = localStorage.getItem('breeze_user_id');
    if (id) return id;
    const legacy = localStorage.getItem('wl_user_id');
    if (legacy) { localStorage.setItem('breeze_user_id', legacy); return legacy; }
  } catch (e) {}
  return null;
}

async function init() {
  try { db = await claude.use('db'); } catch (e) { db = null; }
  try { assets = await claude.use('assets'); } catch (e) { assets = null; }

  const userId = readStoredUserId();

  if (!db) { renderNoDb(); return; }

  if (userId) {
    try {
      const doc = await db.doc('users/' + userId).get();
      if (doc && doc.exists !== false && (doc.data ? doc.data() : doc)) {
        currentUser = normalizeUser(userId, doc.data ? doc.data() : doc);
      }
    } catch (e) {}
  }

  if (!currentUser) { renderOnboarding(); }
  else { subscribeAll(); renderShell(); }
}

function normalizeUser(id, data) {
  return {
    id,
    name: data.name || 'Explorer',
    color: data.color || colorForId(id),
    rankedList: Array.isArray(data.rankedList) ? data.rankedList : [],
    bucketList: Array.isArray(data.bucketList) ? data.bucketList : [],
  };
}

function renderNoDb() {
  app.innerHTML = `
    <div class="onboard-wrap">
      <div class="onboard-mark">${ICONS.pin}</div>
      <h1>Breeze</h1>
      <p>This preview needs shared storage to sync activities between friends, which isn't available in this view. Try opening the published link instead.</p>
    </div>`;
}

function renderOnboarding() {
  app.innerHTML = `
    <div class="onboard-wrap">
      <div class="onboard-mark">${ICONS.pin}</div>
      <h1>Breeze</h1>
      <p>Log your hikes, lookouts, and trips. Rank them against each other, and see what your friends have been exploring.</p>
      <div class="onboard-form">
        <input class="field-input" id="nameInput" placeholder="What should we call you?" maxlength="30" autocomplete="off">
        <div class="error-text hidden" id="nameError" hidden>Enter a name to continue</div>
        <button class="btn-primary" id="startBtn">Get started</button>
      </div>
    </div>`;
  const input = document.getElementById('nameInput');
  const err = document.getElementById('nameError');
  const go = async () => {
    const name = input.value.trim();
    if (!name) { err.hidden = false; return; }
    err.hidden = true;
    const id = uid();
    const color = colorForId(id);
    const data = { name, color, rankedList: [], bucketList: [], createdAt: Date.now() };
    try { await db.doc('users/' + id).set(data); } catch (e) { toast('Could not create profile — try again'); return; }
    try { localStorage.setItem('breeze_user_id', id); } catch (e) {}
    currentUser = normalizeUser(id, data);
    subscribeAll();
    renderShell();
  };
  document.getElementById('startBtn').addEventListener('click', go);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  input.focus();
}

function subscribeAll() {
  try {
    const userUnsub = db.doc('users/' + currentUser.id).onSnapshot((snap) => {
      const data = snap && snap.data ? snap.data() : snap;
      if (data) {
        currentUser = normalizeUser(currentUser.id, data);
        if (currentTab === 'rankings' || currentTab === 'saved') renderScreen();
        else updateFeedRankBadges();
      }
    });
    if (userUnsub) unsubFns.push(userUnsub);
  } catch (e) {}

  try {
    const q = db.collection('activities').orderBy('timestamp', 'desc').limit(200);
    const actUnsub = q.onSnapshot((snap) => {
      const docs = snap && snap.docs ? snap.docs : [];
      activitiesMap = {};
      activitiesOrder = [];
      docs.forEach(d => {
        const data = d.data ? d.data() : d;
        const id = d.id || data.id;
        activitiesMap[id] = { id, ...data };
        activitiesOrder.push(id);
        if (data.userId && !usersMap[data.userId]) {
          usersMap[data.userId] = { name: data.userName, color: data.userColor };
        }
      });
      if (currentTab === 'feed' || currentTab === 'saved' || currentTab === 'rankings') renderScreen();
    });
    if (actUnsub) unsubFns.push(actUnsub);
  } catch (e) {}
}

function renderShell() {
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">Breeze</div>
      <div class="topbar-actions">
        <button class="log-btn" id="logBtn">${ICONS.plus}Log</button>
        <button class="avatar-btn" id="meBtn" style="background:${currentUser.color}">${escapeHtml(initials(currentUser.name))}</button>
      </div>
    </div>
    <div id="screenHost" class="screen"></div>
    <div class="bottomnav">
      <div class="bottomnav-inner">
        <button class="navbtn" data-tab="feed">${ICONS.home}Feed</button>
        <button class="navbtn" data-tab="rankings">${ICONS.ranks}My ranks</button>
        <button class="navbtn" data-tab="saved">${ICONS.saved}Saved</button>
      </div>
    </div>
  `;
  document.getElementById('logBtn').addEventListener('click', openLogModal);
  document.getElementById('meBtn').addEventListener('click', showSwitchAccount);
  document.querySelectorAll('.navbtn').forEach(b => b.addEventListener('click', () => { currentTab = b.dataset.tab; renderScreen(); }));
  currentTab = 'feed';
  renderScreen();
}

function showSwitchAccount() {
  if (confirm('Switch to a different name on this device? This will not delete your saved data, just log this browser out.')) {
    try { localStorage.removeItem('breeze_user_id'); localStorage.removeItem('wl_user_id'); } catch (e) {}
    unsubFns.forEach(fn => { try { fn(); } catch (e) {} });
    unsubFns = [];
    currentUser = null;
    renderOnboarding();
  }
}

function renderScreen() {
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
  const host = document.getElementById('screenHost');
  if (!host) return;
  if (currentTab === 'feed') renderFeed(host);
  else if (currentTab === 'rankings') renderRankings(host);
  else if (currentTab === 'saved') renderSaved(host);
}

function updateFeedRankBadges() {
  document.querySelectorAll('[data-rank-owner]').forEach(el => {
    const ownerId = el.getAttribute('data-rank-owner');
    const actId = el.getAttribute('data-rank-act');
    const txt = rankBadgeText(ownerId, actId);
    el.textContent = txt;
    el.classList.toggle('empty', !txt);
  });
}

function rankBadgeText(ownerId, actId) {
  const list = (ownerId === currentUser.id) ? currentUser.rankedList : null;
  if (!list) return '';
  const idx = list.indexOf(actId);
  if (idx === -1) return '';
  return '#' + (idx + 1) + ' of ' + list.length;
}

function renderFeed(host) {
  const filtered = activitiesOrder.filter(id => feedFilter === 'all' || activitiesMap[id].type === feedFilter);
  const chips = ['<button class="chip ' + (feedFilter==='all'?'active':'') + '" data-f="all">All</button>']
    .concat(TYPES.map(t => `<button class="chip ${feedFilter===t.id?'active':''}" data-f="${t.id}">${ICONS[t.icon]}${t.label}</button>`)).join('');

  let cardsHtml = '';
  if (filtered.length === 0) {
    cardsHtml = `<div class="empty-state"><div class="icon-wrap">${ICONS.home}</div><p>No activities yet — be the first to log one and start the leaderboard.</p></div>`;
  } else {
    cardsHtml = filtered.map(id => activityCardHtml(activitiesMap[id])).join('');
  }

  host.innerHTML = `
    <h1 class="screen-title">Feed</h1>
    <p class="screen-sub">What your friends have been up to</p>
    <div class="chip-row">${chips}</div>
    <div id="feedCards">${cardsHtml}</div>
  `;
  host.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { feedFilter = c.dataset.f; renderScreen(); }));
  host.querySelectorAll('.save-btn').forEach(b => b.addEventListener('click', () => toggleSave(b.dataset.act)));
}

function activityCardHtml(a) {
  const ti = typeInfo(a.type);
  const isMine = a.userId === currentUser.id;
  const rankTxt = isMine ? rankBadgeText(a.userId, a.id) : '';
  const saved = currentUser.bucketList.includes(a.id);
  const photo = a.photoUrl ? `<img class="card-photo" src="${escapeHtml(a.photoUrl)}" alt="">` : '';
  return `
    <div class="card">
      ${photo}
      <div class="card-body">
        <div class="card-user-row">
          <div class="mini-avatar" style="background:${a.userColor || colorForId(a.userId||'x')}">${escapeHtml(initials(a.userName))}</div>
          <div style="flex:1">
            <div class="card-user-name">${escapeHtml(a.userName)}</div>
            <div class="card-time">${timeAgo(a.timestamp || Date.now())}</div>
          </div>
          <span class="type-tag">${ICONS[ti.icon]}${ti.label}</span>
        </div>
        <div class="card-title-row"><div class="card-title">${escapeHtml(a.title)}</div></div>
        <div class="card-loc">${ICONS.pin}${escapeHtml(a.location || 'Unspecified')}</div>
        ${a.review ? `<div class="card-review">${escapeHtml(a.review)}</div>` : ''}
        <div class="card-footer">
          <span class="rank-badge ${rankTxt ? '' : 'empty'}" data-rank-owner="${a.userId}" data-rank-act="${a.id}">${rankTxt || (isMine ? '' : 'Friend pick')}</span>
          <button class="save-btn ${saved?'saved':''}" data-act="${a.id}" title="Save to bucket list">${saved ? ICONS.savedFilled : ICONS.saved}</button>
        </div>
      </div>
    </div>`;
}

async function toggleSave(actId) {
  if (!currentUser.bucketList.includes(actId)) {
    if (activitiesMap[actId] && activitiesMap[actId].userId === currentUser.id) { toast("That's your own activity"); return; }
  }
  const list = currentUser.bucketList.slice();
  const idx = list.indexOf(actId);
  if (idx === -1) { list.push(actId); toast('Saved to your bucket list'); }
  else { list.splice(idx, 1); toast('Removed from bucket list'); }
  currentUser.bucketList = list;
  try { await db.doc('users/' + currentUser.id).update({ bucketList: list }); } catch (e) { toast('Could not save — try again'); }
  renderScreen();
}

function renderRankings(host) {
  const list = currentUser.rankedList.filter(id => activitiesMap[id]);
  const stat1 = list.length;
  const types = new Set(list.map(id => activitiesMap[id].type));
  host.innerHTML = `
    <h1 class="screen-title">My rankings</h1>
    <p class="screen-sub">Your adventures, best to worst</p>
    <div class="stat-row">
      <div class="stat-card"><div class="n">${stat1}</div><div class="l">Logged</div></div>
      <div class="stat-card"><div class="n">${types.size}</div><div class="l">Types tried</div></div>
    </div>
    <div id="rankList">
      ${list.length === 0
        ? `<div class="empty-state"><div class="icon-wrap">${ICONS.ranks}</div><p>Log your first activity to start building your ranked list.</p></div>`
        : list.map((id, i) => rankRowHtml(activitiesMap[id], i)).join('')}
    </div>
  `;
}

function rankRowHtml(a, i) {
  const ti = typeInfo(a.type);
  return `
    <div class="rank-row">
      <div class="rank-num ${i===0?'top':''}">${i+1}</div>
      <div class="rank-info">
        ${ICONS[ti.icon]}
        <div class="t-wrap">
          <div class="t">${escapeHtml(a.title)}</div>
          <div class="l">${escapeHtml(a.location || '')}</div>
        </div>
      </div>
    </div>`;
}

function renderSaved(host) {
  const list = currentUser.bucketList.filter(id => activitiesMap[id]);
  host.innerHTML = `
    <h1 class="screen-title">Saved</h1>
    <p class="screen-sub">Places friends ranked highly that you want to try</p>
    <div>
      ${list.length === 0
        ? `<div class="empty-state"><div class="icon-wrap">${ICONS.savedFilled}</div><p>Tag activities from the feed to build your want-to-go list.</p></div>`
        : list.map(id => activityCardHtml(activitiesMap[id])).join('')}
    </div>
  `;
  host.querySelectorAll('.save-btn').forEach(b => b.addEventListener('click', () => toggleSave(b.dataset.act)));
}

/* ---------- Log activity flow ---------- */
let logState = { type: 'hike', title: '', location: '', review: '' };

function openLogModal() {
  logState = { type: 'hike', title: '', location: '', review: '' };
  pendingPhoto = null;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'logOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Log an activity</div>
      <div class="modal-sub">Add it, then rank it against your others</div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <div class="type-grid" id="typeGrid">
          ${TYPES.map(t => `<button class="type-opt ${t.id==='hike'?'active':''}" data-type="${t.id}">${ICONS[t.icon]}${t.label}</button>`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="titleInput">Title</label>
        <input class="field-input" id="titleInput" placeholder="e.g. Buttermilk Falls sunrise hike" maxlength="60">
      </div>
      <div class="form-group">
        <label class="form-label" for="locInput">Location</label>
        <input class="field-input" id="locInput" placeholder="e.g. Ithaca, NY" maxlength="60">
      </div>
      <div class="form-group">
        <label class="form-label" for="reviewInput">Quick review (optional)</label>
        <textarea class="field-input" id="reviewInput" rows="3" placeholder="How was it? Worth the hype?" maxlength="280"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Photo (optional)</label>
        <div class="photo-upload" id="photoUpload">
          <input type="file" accept="image/*" id="photoInput">
          <span id="photoUploadLabel">Tap to add a photo</span>
        </div>
        <img class="photo-preview hidden" id="photoPreview" hidden>
      </div>
      <div class="error-text hidden" id="logError" hidden>Add a title to continue</div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn-secondary" id="cancelLog" style="flex:1">Cancel</button>
        <button class="btn-primary" id="nextLog" style="flex:2">Next: rank it</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('typeGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('.type-opt'); if (!btn) return;
    logState.type = btn.dataset.type;
    document.querySelectorAll('#typeGrid .type-opt').forEach(b => b.classList.toggle('active', b === btn));
  });
  const photoInput = document.getElementById('photoInput');
  if (!assets) {
    document.getElementById('photoUploadLabel').textContent = 'Photo upload unavailable in this view';
    photoInput.disabled = true;
  } else {
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pendingPhoto = file;
      const url = URL.createObjectURL(file);
      const preview = document.getElementById('photoPreview');
      preview.src = url; preview.hidden = false;
      document.getElementById('photoUploadLabel').textContent = 'Photo selected — tap to change';
    });
  }
  document.getElementById('cancelLog').addEventListener('click', () => overlay.remove());
  document.getElementById('nextLog').addEventListener('click', () => {
    const title = document.getElementById('titleInput').value.trim();
    const err = document.getElementById('logError');
    if (!title) { err.hidden = false; return; }
    err.hidden = true;
    logState.title = title;
    logState.location = document.getElementById('locInput').value.trim();
    logState.review = document.getElementById('reviewInput').value.trim();
    overlay.remove();
    startRankingFlow();
  });
}

/* ---------- Comparative ranking flow ---------- */
let rankSession = null;

function startRankingFlow() {
  const list = currentUser.rankedList.filter(id => activitiesMap[id]);
  if (list.length === 0) { finalizeNewActivity(0); return; }
  rankSession = { lo: 0, hi: list.length, list, totalSteps: Math.ceil(Math.log2(list.length + 1)) || 1, step: 0 };
  showComparisonStep();
}

function showComparisonStep() {
  const { lo, hi, list } = rankSession;
  if (lo >= hi) { finalizeNewActivity(lo); return; }
  const mid = Math.floor((lo + hi) / 2);
  const otherId = list[mid];
  const other = activitiesMap[otherId];
  const newTi = typeInfo(logState.type);
  const otherTi = typeInfo(other.type);
  rankSession.step++;
  const pct = Math.min(100, Math.round((rankSession.step / (rankSession.totalSteps + 1)) * 100));

  const overlay = document.createElement('div');
  overlay.className = 'overlay center';
  overlay.id = 'rankOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Which did you enjoy more?</div>
      <div class="modal-sub">This places your new activity on your ranked list</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="vs-row">
        <div class="vs-card" id="pickNew">
          ${ICONS[newTi.icon]}
          <span class="name">${escapeHtml(logState.title)}</span>
          <span class="loc">${escapeHtml(logState.location || 'New activity')}</span>
        </div>
        <div class="vs-card" id="pickOther">
          ${ICONS[otherTi.icon]}
          <span class="name">${escapeHtml(other.title)}</span>
          <span class="loc">${escapeHtml(other.location || '')}</span>
        </div>
      </div>
      <div class="vs-divider">Tap the one you liked better</div>
      <button class="btn-ghost" id="skipRank" style="display:block; margin: 4px auto 0;">Not sure — put it in the middle</button>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('pickNew').addEventListener('click', () => { rankSession.hi = mid; overlay.remove(); showComparisonStep(); });
  document.getElementById('pickOther').addEventListener('click', () => { rankSession.lo = mid + 1; overlay.remove(); showComparisonStep(); });
  document.getElementById('skipRank').addEventListener('click', () => { overlay.remove(); finalizeNewActivity(mid); });
}

async function finalizeNewActivity(insertIndex) {
  const id = uid();
  let photoUrl = null;
  if (pendingPhoto && assets) {
    try {
      toast('Uploading photo…');
      const res = await assets.upload(pendingPhoto);
      photoUrl = res && res.url;
    } catch (e) { /* continue without photo */ }
  }
  const data = {
    userId: currentUser.id,
    userName: currentUser.name,
    userColor: currentUser.color,
    type: logState.type,
    title: logState.title,
    location: logState.location,
    review: logState.review,
    photoUrl: photoUrl,
    timestamp: Date.now(),
  };
  try { await db.doc('activities/' + id).set(data); } catch (e) { toast('Could not save activity — try again'); return; }

  const newList = currentUser.rankedList.filter(x => activitiesMap[x]);
  newList.splice(insertIndex, 0, id);
  currentUser.rankedList = newList;
  try { await db.doc('users/' + currentUser.id).update({ rankedList: newList }); } catch (e) {}

  activitiesMap[id] = { id, ...data };
  activitiesOrder.unshift(id);

  toast('Added! Ranked #' + (insertIndex + 1) + ' of ' + newList.length);
  currentTab = 'rankings';
  renderScreen();
}

init();
</script>
