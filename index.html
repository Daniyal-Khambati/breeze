<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Breeze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Retro national-park-poster palette: warm parchment paper, a rust/orange
     "trail blaze" accent lifted straight from the hiker's pack, and gold for
     secondary highlights. Flat color blocks only — no gradients. */
  --bg: #f2e4c4;
  --surface: #fbf3e0;
  --surface-2: #e8d5a8;
  --surface-3: #dcc086;
  --border: #b98a4e;
  --border-soft: #ddc38c;
  --text: #2c1f14;
  --text-secondary: #71583a;
  --text-muted: #a08a54;
  --accent: #c9531f;
  --accent-strong: #963d16;
  --accent-soft: rgba(201, 83, 31, 0.16);
  --on-accent: #fbf3e0;
  --gold: #e0a23c;
  --gold-soft: rgba(224, 162, 60, 0.22);
  --on-gold: #2c1c08;
  --danger: #963d16;
  --danger-soft: rgba(150, 61, 22, 0.16);
  --radius-lg: 10px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(44, 31, 20, 0.12);
  --shadow-md: 0 4px 14px rgba(44, 31, 20, 0.18);
  --font-sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Baloo 2', var(--font-sans);
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  font-size: 16px; line-height: 1.5;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 84px; }
img { max-width: 100%; display: block; }
button { font-family: var(--font-sans); cursor: pointer; }
input, textarea, select { font-family: var(--font-sans); }
[hidden] { display: none !important; }
svg { width: 1em; height: 1em; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* Scene banner — a static, flat-vector illustrated strip (banded sunset
   sky, layered mountain silhouettes, a treeline framing the edges, and the
   hiker sprite on the trail) that sits above the functional top bar. It is
   purely decorative and scrolls away with the page like a masthead. */
.scene-banner { width: 100%; aspect-ratio: 400 / 150; overflow: hidden; display: block; }
.scene-banner svg { display: block; width: 100%; height: 100%; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 2px solid var(--border);
}
.brand {
  font-family: var(--font-display); font-weight: 800; font-size: 22px;
  letter-spacing: -0.01em; color: var(--accent);
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.log-btn {
  display: flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent);
  border: 1.5px solid var(--accent-strong); padding: 8px 14px 8px 11px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px;
}
.log-btn svg { font-size: 15px; }
.log-btn:active { background: var(--accent-strong); }
.avatar-btn {
  width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); color: #fff;
  font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.02em;
}

/* Onboarding */
.onboard-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  text-align: center; overflow-y: auto;
}
.onboard-hero { width: 100%; aspect-ratio: 400 / 260; overflow: hidden; }
.onboard-hero svg { display: block; width: 100%; height: 100%; }
.onboard-body { width: 100%; box-sizing: border-box; padding: 26px 32px 32px; display: flex; flex-direction: column; align-items: center; }
.onboard-wrap h1 {
  font-family: var(--font-display); font-weight: 800; color: var(--accent);
  font-size: 30px; margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance;
}
.onboard-wrap p { color: var(--text-secondary); font-size: 14.5px; line-height: 1.55; margin: 0 0 26px; max-width: 320px; text-wrap: balance; }
.onboard-form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }

.field-input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 15px; outline: none;
}
.field-input::placeholder { color: var(--text-muted); opacity: 1; }
.field-input:focus { border-color: var(--accent); }
textarea.field-input { resize: none; font-size: 15px; }

.btn-primary {
  background: var(--accent); color: var(--on-accent); border: 1px solid var(--border); padding: 12px 20px; border-radius: var(--radius-md);
  font-weight: 700; font-size: 15px; width: 100%;
}
.btn-primary:active { background: var(--accent-strong); }
.btn-primary:disabled { opacity: 0.5; }
.btn-secondary {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  padding: 11px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px;
}
.btn-secondary:active { background: var(--surface-2); }
.btn-ghost {
  background: transparent; border: none; color: var(--text-secondary); font-size: 12.5px; font-weight: 600;
  padding: 6px;
}
.btn-ghost:hover { color: var(--text); }

/* Main content */
.screen { flex: 1; padding: 4px 20px 20px; }
.screen-title {
  font-family: var(--font-display); font-weight: 800; font-size: 27px; margin: 4px 0 4px;
  letter-spacing: -0.01em; text-wrap: balance;
}
.screen-sub {
  color: var(--text-secondary); font-size: 11.5px; margin: 0 0 16px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}

/* Featured lists row */
.featured-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 14px; margin-bottom: 4px; scrollbar-width: none; }
.featured-row::-webkit-scrollbar { display: none; }
.featured-card {
  flex-shrink: 0; width: 136px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 14px 13px 13px; display: flex; flex-direction: column; align-items: flex-start; gap: 9px; text-align: left;
}
.featured-card .ft-icon {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.featured-card .ft-title { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.featured-card .ft-sub { font-size: 11px; color: var(--text-muted); }
.featured-card.prompt { background: var(--accent-soft); border-color: transparent; color: var(--accent-strong); }
.featured-card.prompt .ft-icon { background: var(--surface); }

/* Filter dropdown */
.filter-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.filter-dropdown { position: relative; }
.filter-trigger {
  display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--text);
}
.filter-trigger svg:first-child { font-size: 13px; color: var(--text-secondary); }
.filter-trigger svg:last-child { font-size: 13px; color: var(--text-muted); transition: transform 0.15s ease; }
.filter-trigger.open svg:last-child { transform: rotate(180deg); }
.filter-menu {
  position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 6px; min-width: 172px; z-index: 15;
  display: flex; flex-direction: column; gap: 1px; max-height: 320px; overflow-y: auto;
}
.filter-option {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px;
  font-weight: 600; color: var(--text-secondary); background: none; border: none; width: 100%; text-align: left;
}
.filter-option svg { font-size: 15px; }
.filter-option.active { background: var(--accent-soft); color: var(--accent-strong); }

/* Activity card */
.card {
  background: var(--surface); border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  margin-bottom: 14px; overflow: hidden;
}
.card-photo { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--surface-2); }
.card-body { padding: 14px 16px 15px; }
.card-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.mini-avatar {
  width: 28px; height: 28px; border-radius: var(--radius-sm); color: #fff; font-weight: 700; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--border);
}
.card-user-name { font-weight: 700; font-size: 13px; }
.card-time { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.card-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.card-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.card-loc { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 9px; }
.card-loc svg { font-size: 13px; color: var(--text-muted); }
.card-review { font-size: 13.5px; color: var(--text); line-height: 1.55; margin-bottom: 11px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.rank-badge {
  display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 4px 10px 4px 8px;
  border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-secondary);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.rank-badge svg { font-size: 12px; }
.rank-badge.empty { background: none; padding: 4px 0; font-family: var(--font-sans); }
.save-btn {
  background: none; border: none; padding: 4px; color: var(--text-muted); font-size: 19px;
  display: flex; align-items: center;
}
.save-btn.saved { color: var(--accent); }
.type-tag {
  display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px;
  border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-secondary);
}
.type-tag svg { font-size: 12.5px; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state .icon-wrap {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 14px;
}
.empty-state p { font-size: 13.5px; margin: 0; max-width: 260px; margin-inline: auto; line-height: 1.5; }
.empty-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.empty-actions .btn-primary, .empty-actions .btn-secondary { width: auto; padding-inline: 18px; }

/* Log form */
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; display: block;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.type-opt {
  padding: 12px 4px 10px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: var(--text-secondary);
}
.type-opt.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.type-opt svg { font-size: 19px; }
.photo-upload {
  border: 1.5px dashed var(--border); border-radius: var(--radius-md); padding: 18px; text-align: center;
  color: var(--text-muted); font-size: 12.5px; position: relative; cursor: pointer;
}
.photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-preview { width: 100%; border-radius: var(--radius-md); margin-top: 10px; max-height: 190px; object-fit: cover; }

/* Overlay / modal */
.overlay {
  position: fixed; inset: 0; background: rgba(30, 27, 20, 0.5); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
}
.overlay.center { align-items: center; padding: 20px; }
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border: 1px solid var(--border); border-bottom: none;
}
.overlay.center .modal { border-radius: 18px; border-bottom: 1px solid var(--border); }
.modal-title {
  font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 4px;
  text-align: center; letter-spacing: -0.01em;
}
.modal-sub { font-size: 12.5px; color: var(--text-secondary); text-align: center; margin: 0 0 20px; }

/* Friends sheet */
.friend-code-box {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px;
}
.friend-code-box .code { font-family: var(--font-mono); font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: var(--text); }
.add-friend-row { display: flex; gap: 8px; }
.add-friend-row .field-input { flex: 1; }
.add-friend-row .btn-primary { width: auto; flex-shrink: 0; padding-inline: 18px; }
.friend-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; }
.friend-row .name { flex: 1; font-weight: 600; font-size: 13.5px; }

/* Summit (mountain gamification) */
.mountain-wrap { border-radius: var(--radius-lg); overflow: hidden; border: 2px solid var(--border); margin-bottom: 14px; }
.mountain-wrap svg { display: block; width: 100%; height: auto; }
.climb-readout { font-size: 12.5px; color: var(--text-secondary); text-align: center; margin: 0 0 16px; }
.progress-bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin: 0 0 10px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.scope-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.scope-toggle { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 2px; }
.scope-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-sm); border: none; background: none; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.scope-btn svg { font-size: 13px; }
.scope-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.dest-list { margin-top: 4px; }
.dest-row {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px; text-align: left;
}
.dest-row.done { border-color: var(--accent); background: var(--accent-soft); }
.dest-check {
  width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: var(--on-accent);
}
.dest-row.done .dest-check { background: var(--accent); border-color: var(--accent); }
.dest-check svg { font-size: 12px; }
.dest-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dest-name { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.dest-loc { font-size: 11.5px; color: var(--text-muted); }
.dest-badge {
  flex-shrink: 0; font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text-secondary); font-family: var(--font-mono); white-space: nowrap;
}
.preset-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Duel comparison */
.duel-compare { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin: 4px 0 12px; }
.duel-card {
  position: relative; width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--border);
  background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 16px 20px; text-align: center;
}
.duel-card.front {
  background: var(--surface); box-shadow: var(--shadow-sm); cursor: grab; user-select: none;
  touch-action: pan-y; will-change: transform;
}
.duel-card.front:active { cursor: grabbing; }
.duel-card-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.duel-card svg { font-size: 24px; color: var(--text-secondary); }
.duel-card .name { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.duel-card .loc { font-size: 11.5px; color: var(--text-muted); }
.duel-vs {
  align-self: center; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-muted);
  background: var(--bg); padding: 2px 8px; border-radius: var(--radius-sm); margin: -2px 0;
}
.duel-stamp {
  position: absolute; top: 14px; padding: 5px 11px; border-radius: var(--radius-sm); font-size: 10.5px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.06em; opacity: 0; border: 1.5px solid; pointer-events: none;
}
.duel-stamp.right { right: 14px; color: var(--accent-strong); border-color: var(--accent); transform: rotate(8deg); }
.duel-stamp.left { left: 14px; color: var(--text-secondary); border-color: var(--text-muted); transform: rotate(-8deg); }
.duel-hint-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin: 0 0 16px; }
.duel-hint-row span { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
.duel-hint-row span > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duel-hint-row span:last-child { flex-direction: row-reverse; text-align: right; }
.duel-hint-row svg { font-size: 13px; flex-shrink: 0; }
.duel-actions { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 6px; }
.duel-btn {
  width: 46px; height: 46px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
}
.duel-btn svg { font-size: 19px; }
.duel-btn.like { border-color: var(--accent); color: var(--accent); }

/* Ranking list */
.rank-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px;
}
.rank-num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--text-secondary);
  font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-family: var(--font-mono);
}
.rank-num.top { background: var(--gold); color: var(--on-gold); }
.rank-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; }
.rank-info svg { font-size: 15px; color: var(--text-muted); flex-shrink: 0; }
.rank-info .t-wrap { min-width: 0; }
.rank-info .t { font-family: var(--font-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-info .l { font-size: 11.5px; color: var(--text-muted); }
.rank-stars { display: flex; align-items: center; gap: 1px; flex-shrink: 0; margin-left: 8px; font-size: 13px; }
.star { position: relative; display: inline-flex; color: var(--border-soft); }
.star.full { color: var(--gold); }
.star-fill-half { position: absolute; inset: 0; width: 50%; overflow: hidden; color: var(--gold); }

/* Bottom nav */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex; justify-content: center;
}
.bottomnav-inner { max-width: 480px; width: 100%; display: flex; }
.navbtn {
  flex: 1; background: none; border: none; padding: 9px 4px 9px; display: flex; flex-direction: column;
  align-items: center; gap: 4px; color: var(--text-muted); font-size: 10.5px; font-weight: 700;
}
.navbtn svg {
  width: 40px; height: 24px; border-radius: var(--radius-sm); transition: background 0.1s ease, color 0.1s ease;
}
.navbtn.active { color: var(--accent-strong); }
.navbtn.active svg { background: var(--gold-soft); color: var(--accent-strong); }

.toast {
  position: fixed; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px;
  font-weight: 600; z-index: 200; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function readStoredUserId() {
  try {
    const id = localStorage.getItem('breeze_user_id');
    if (id) return id;
    const legacy = localStorage.getItem('wl_user_id');
    if (legacy) { localStorage.setItem('breeze_user_id', legacy); return legacy; }
  } catch (e) {}
  return null;
}

async function init() {
  try { db = await claude.use('db'); } catch (e) { db = null; }
  try { assets = await claude.use('assets'); } catch (e) { assets = null; }

  const userId = readStoredUserId();

  if (!db) { renderNoDb(); return; }

  if (userId) {
    try {
      const doc = await db.doc('users/' + userId).get();
      if (doc && doc.exists !== false && (doc.data ? doc.data() : doc)) {
        currentUser = normalizeUser(userId, doc.data ? doc.data() : doc);
      }
    } catch (e) {}
  }

  if (!currentUser) { renderOnboarding(); }
  else { subscribeAll(); renderShell(); }
}

function normalizeUser(id, data) {
  return {
    id,
    name: data.name || 'Explorer',
    color: data.color || colorForId(id),
    code: data.code || '',
    region: data.region || '',
    rankedList: Array.isArray(data.rankedList) ? data.rankedList : [],
    bucketList: Array.isArray(data.bucketList) ? data.bucketList : [],
    friends: Array.isArray(data.friends) ? data.friends : [],
  };
}

function renderNoDb() {
  app.innerHTML = `

      <div class="onboard-hero">${buildMountainSvg(getSeason(), 0.4)}</div>

}

function renderOnboarding() {
  app.innerHTML = `
    <div class="onboard-wrap">

function syncFriendSubscriptions() {
  const friends = currentUser.friends || [];
  friends.forEach(fid => {
    if (friendUnsubs[fid]) return;
    try {
      friendUnsubs[fid] = db.doc('users/' + fid).onSnapshot((snap) => {
        const data = snap && snap.data ? snap.data() : snap;
        if (data) { friendDocs[fid] = normalizeUser(fid, data); renderScreen(); }
      });
    } catch (e) {}
  });
  Object.keys(friendUnsubs).forEach(fid => {
    if (!friends.includes(fid)) {
      try { friendUnsubs[fid](); } catch (e) {}
      delete friendUnsubs[fid];
      delete friendDocs[fid];
    }
  });
}

function subscribeAll() {
  try {
    const userUnsub = db.doc('users/' + currentUser.id).onSnapshot((snap) => {
      const data = snap && snap.data ? snap.data() : snap;
      if (data) {
        const prevFriends = (currentUser.friends || []).join(',');
        currentUser = normalizeUser(currentUser.id, data);
        syncFriendSubscriptions();
        const friendsChanged = prevFriends !== (currentUser.friends || []).join(',');
        if (friendsChanged || currentTab === 'rankings' || currentTab === 'saved' || currentTab === 'summit') renderScreen();
        else updateFeedRankBadges();
      }
    });
    if (userUnsub) unsubFns.push(userUnsub);
  } catch (e) {}

  try {
    const q = db.collection('activities').orderBy('timestamp', 'desc').limit(200);
    const actUnsub = q.onSnapshot((snap) => {
      const docs = snap && snap.docs ? snap.docs : [];
      activitiesMap = {};
      activitiesOrder = [];
      docs.forEach(d => {
        const data = d.data ? d.data() : d;
        const id = d.id || data.id;
        activitiesMap[id] = { id, ...data };
        activitiesOrder.push(id);
        if (data.userId && !usersMap[data.userId]) {
          usersMap[data.userId] = { name: data.userName, color: data.userColor };
        }
      });
      if (currentTab === 'feed' || currentTab === 'saved' || currentTab === 'rankings' || currentTab === 'summit') renderScreen();
    });
    if (actUnsub) unsubFns.push(actUnsub);
  } catch (e) {}
}

function showSwitchAccount() {
  if (confirm('Switch to a different name on this device? This will not delete your saved data, just log this browser out.')) {
    try { localStorage.removeItem('breeze_user_id'); localStorage.removeItem('wl_user_id'); } catch (e) {}
    unsubFns.forEach(fn => { try { fn(); } catch (e) {} });
    unsubFns = [];
    Object.values(friendUnsubs).forEach(fn => { try { fn(); } catch (e) {} });

  document.querySelectorAll('[data-rank-owner]').forEach(el => {

function rankBadgeText(ownerId, actId) {
  const list = ownerId === currentUser.id ? currentUser.rankedList : (friendDocs[ownerId] ? friendDocs[ownerId].rankedList : null);
  if (!list) return '';
  const idx = list.indexOf(actId);
  if (idx === -1) return '';
  return '#' + (idx + 1) + ' of ' + list.length;
}

function isVisibleActivity(a) {

async function addFriendByCode(overlay) {
  const input = document.getElementById('friendCodeInput');
  const err = document.getElementById('friendError');
  const code = input.value.trim().toUpperCase();
  err.hidden = true;
  if (!code) { err.textContent = 'Enter a code'; err.hidden = false; return; }
  try {
    const snap = await db.collection('users').where('code', '==', code).limit(1).get();
    const docs = snap && snap.docs ? snap.docs : [];
    if (!docs.length) { err.textContent = "No one found with that code"; err.hidden = false; return; }
    const targetDoc = docs[0];
    const targetId = targetDoc.id;
    const targetData = targetDoc.data() || {};
    if (targetId === currentUser.id) { err.textContent = "That's your own code"; err.hidden = false; return; }
    if ((currentUser.friends || []).includes(targetId)) { err.textContent = 'Already friends'; err.hidden = false; return; }
    const newMine = Array.from(new Set([...(currentUser.friends || []), targetId]));
    const newTheirs = Array.from(new Set([...(Array.isArray(targetData.friends) ? targetData.friends : []), currentUser.id]));
    await db.doc('users/' + currentUser.id).update({ friends: newMine });
    await db.doc('users/' + targetId).update({ friends: newTheirs });
    currentUser.friends = newMine;
    syncFriendSubscriptions();
    toast('Added ' + (targetData.name || 'friend'));
    overlay.remove();
    openFriendsSheet();
  } catch (e) {
    err.textContent = "Couldn't add that friend — try again";
    err.hidden = false;
  }
}

async function removeFriend(fid, overlay) {
  const newMine = (currentUser.friends || []).filter(id => id !== fid);
  currentUser.friends = newMine;
  try { await db.doc('users/' + currentUser.id).update({ friends: newMine }); } catch (e) {}
  try {
    const fd = friendDocs[fid];
    if (fd) {
      const theirFriends = (fd.friends || []).filter(id => id !== currentUser.id);
      await db.doc('users/' + fid).update({ friends: theirFriends });
    }
  } catch (e) {}
  syncFriendSubscriptions();
  overlay.remove();
  openFriendsSheet();
}

/* ---------- Summit (gamified mountain) ---------- */
function normalizeText(s) { return (s || '').toLowerCase().trim(); }

function locationsMatch(a, b) {
  const na = normalizeText(a), nb = normalizeText(b);
  if (!na || !nb) return false;
  return na === nb || na.includes(nb) || nb.includes(na);
}

function matchPreset(regionText) {
  const t = normalizeText(regionText);
  if (!t) return null;
  return REGION_PRESETS.find(p => p.matchTokens.some(tok => t.includes(tok))) || null;
}

function discoverRealDestinations(filterFn) {
  const groups = {};
  activitiesOrder.forEach(id => {
    const a = activitiesMap[id];
    if (!a || !a.location) return;
    if (filterFn && !filterFn(a)) return;
    const key = normalizeText(a.location);
    if (!key) return;
    if (!groups[key]) groups[key] = { location: a.location, count: 0 };
    groups[key].count++;
  });
  return Object.values(groups).sort((x, y) => y.count - x.count);
}

function buildDestinationList(regionText, everywhere) {
  if (everywhere) {
    const real = discoverRealDestinations(null).slice(0, 25);
    return { label: 'Everywhere', items: real.map(r => ({ name: r.location, location: r.location, count: r.count, seeded: false })) };
  }
  const preset = matchPreset(regionText);
  if (preset) {
    const seededItems = preset.destinations.map(d => ({
      name: d.name, location: d.location, seeded: true,
      count: discoverRealDestinations(a => locationsMatch(a.location, d.location)).reduce((s, g) => s + g.count, 0),
    }));
    const coveredKeys = new Set(seededItems.map(d => normalizeText(d.location)));
    const extra = discoverRealDestinations(a => preset.matchTokens.some(tok => normalizeText(a.location).includes(tok)) && !coveredKeys.has(normalizeText(a.location)))
      .map(r => ({ name: r.location, location: r.location, count: r.count, seeded: false }));
    const combined = seededItems.concat(extra).sort((x, y) => y.count - x.count).slice(0, 25);
    return { label: preset.label, items: combined };
  }
  const real = regionText
    ? discoverRealDestinations(a => locationsMatch(a.location, regionText)).map(r => ({ name: r.location, location: r.location, count: r.count, seeded: false }))
    : [];
  const combined = real.concat(GENERIC_PROMPTS).slice(0, 25);
  return { label: regionText || 'your region', items: combined };
}

function computeClimbStats(items) {
  const matchable = items.filter(it => it.location);
  const myPhotos = activitiesOrder
    .map(id => activitiesMap[id])
    .filter(a => a && a.userId === currentUser.id && a.photoUrl);
  let qualifyingCount = 0;
  const completed = new Set();
  myPhotos.forEach(a => {
    matchable.forEach(it => {
      if (locationsMatch(a.location, it.location)) {
        qualifyingCount++;
        completed.add(normalizeText(it.location));
      }
    });
  });
  const total = items.length || 1;
  return { qualifyingCount, completed, total, fraction: Math.min(1, qualifyingCount / total) };
}

function getSeason() {
  const m = new Date().getMonth();
  if (m === 11 || m === 0 || m === 1) return 'winter';
  if (m >= 2 && m <= 4) return 'spring';
  if (m >= 5 && m <= 7) return 'summer';
  return 'fall';
}

function pointAtFraction(frac) {
  frac = Math.max(0, Math.min(1, frac));
  const segCount = TRAIL_ANCHORS.length - 1;
  const pos = frac * segCount;
  const i = Math.min(segCount - 1, Math.floor(pos));
  const t = pos - i;
  const a = TRAIL_ANCHORS[i], b = TRAIL_ANCHORS[i + 1];
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function buildMountainSvg(season, fraction) {
  const c = SEASONS[season];
  const p = pointAtFraction(fraction);
  const trailPts = TRAIL_ANCHORS.map(pt => pt.x + ',' + pt.y).join(' ');
  const flag = fraction >= 1
    ? `<g transform="translate(158,30)"><rect x="0" y="0" width="2.4" height="20" rx="1" fill="${FIGURE_COLOR}"/><polygon points="2.4,0 13,3.5 2.4,7" fill="${FLAG_COLOR}"/></g>`
    : '';
  return `
  <svg viewBox="0 0 400 240" role="img" aria-label="Mountain progress" shape-rendering="crispEdges">
    ${skyBandRects(c)}
    ${sunPoly(320, 55, 22, c)}
    ${farRidgePoly(c)}
    ${midRidgePoly(c)}
    <rect x="141" y="82" width="9" height="9" fill="${c.snow}"/>
    <rect x="130" y="91" width="9" height="9" fill="${c.snow}"/>
    <rect x="152" y="91" width="9" height="9" fill="${c.snow}"/>
    <polyline points="${trailPts}" fill="none" stroke="${c.trail}" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="butt"/>
    ${foregroundBand(c, 205)}
    ${buildHikerSprite(p.x, p.y, 0.6)}
    ${flag}
  </svg>`;
}

/* The decorative masthead scene shared by the top bar and onboarding — the
   same banded-sky, layered-ridge, treeline-and-trail composition as the
   Summit mountain, but static (no progress tracking) with the hiker
   standing partway up a simple winding trail. */
function buildSceneBanner() {
  const c = SEASONS[getSeason()];
  return `
  <svg viewBox="0 0 400 150" role="img" aria-label="A hiker on a mountain trail at sunset" shape-rendering="crispEdges">
    <defs><clipPath id="bannerClip"><rect x="0" y="0" width="400" height="150"/></clipPath></defs>
    <g clip-path="url(#bannerClip)">
      ${skyBandRects(c)}
      ${sunPoly(320, 42, 18, c)}
      ${farRidgePoly(c)}
      ${midRidgePoly(c)}
      <rect x="141" y="82" width="9" height="9" fill="${c.snow}"/>
      <rect x="130" y="91" width="9" height="9" fill="${c.snow}"/>
      <rect x="152" y="91" width="9" height="9" fill="${c.snow}"/>
      <polyline points="50,150 95,125 72,100 115,90" fill="none" stroke="${c.trail}" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="butt"/>
      ${foregroundBand(c, 118)}
      ${buildHikerSprite(95, 125, 0.9)}
    </g>
  </svg>`;
}

function renderSummit(host) {
  const region = peekRegion !== null ? peekRegion : (currentUser.region || '');
  const everywhere = summitScope === 'everywhere';
  const { label, items } = buildDestinationList(region, everywhere);
  const climb = computeClimbStats(items);
  const season = getSeason();
  const seasonLabel = season.charAt(0).toUpperCase() + season.slice(1);
  const needsRegion = !everywhere && !region;

  const bodyHtml = needsRegion ? `
    <div class="empty-state">
      <div class="icon-wrap">${ICONS.pin}</div>
      <p>Set your home region to start climbing toward its top destinations.</p>
      <div class="empty-actions"><button class="btn-primary" id="setRegionBtn">Set your region</button></div>
    </div>` : `
    <div class="mountain-wrap">${buildMountainSvg(season, climb.fraction)}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(climb.fraction * 100)}%"></div></div>
    <p class="climb-readout">${climb.qualifyingCount} of ${climb.total} logged toward the summit &middot; ${seasonLabel}</p>
    <div class="scope-row">
      <div class="scope-toggle">
        <button class="scope-btn ${!everywhere?'active':''}" id="scopeRegionBtn">${ICONS.pin}${escapeHtml(region)}</button>
        <button class="scope-btn ${everywhere?'active':''}" id="scopeEverywhereBtn">${ICONS.globe}Everywhere</button>
      </div>
      <button class="btn-ghost" id="peekBtn">${peekRegion !== null ? 'Back to my region' : 'Check another region'}</button>
    </div>
    ${!everywhere ? `<button class="btn-ghost" id="editRegionBtn" style="padding:2px 6px 12px; display:block;">Edit home region</button>` : ''}
    <div class="dest-list">
      ${items.length === 0
        ? `<div class="empty-state"><p>No destinations to show yet.</p></div>`
        : items.map(it => destRowHtml(it, climb.completed)).join('')}
    </div>`;

  host.innerHTML = `
    <h1 class="screen-title">Summit</h1>
    <p class="screen-sub">Climb toward the region's top destinations</p>

/* Star rating is derived purely from position in the ranked list (best = index 0),
   never stored — so it always reflects the current order and list length,
   recalculating automatically whenever an activity is added, re-ranked, or removed. */
function computeStarRating(index, total) {
  if (total <= 1) return 5;
  const raw = 5 - 4 * (index / (total - 1)); // linear: rank #1 -> 5 stars, last place -> 1 star
  return Math.round(raw * 2) / 2; // snap to the nearest half-star
}

function starRatingHtml(rating) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  let html = `<span class="rank-stars" title="${rating.toFixed(1)} / 5">`;
  for (let i = 0; i < full; i++) html += `<span class="star full">${ICONS.starFilled}</span>`;
  if (half) html += `<span class="star half">${ICONS.star}<span class="star-fill-half">${ICONS.starFilled}</span></span>`;
  for (let i = 0; i < empty; i++) html += `<span class="star empty">${ICONS.star}</span>`;
  html += '</span>';
  return html;
}

function rankRowHtml(a, i, total) {
  const ti = typeInfo(a.type);
  const rating = computeStarRating(i, total);
  return `
    <div class="rank-row">
      <div class="rank-num ${i===0?'top':''}">${i+1}</div>
      <div class="rank-info">
        ${ICONS[ti.icon]}
        <div class="t-wrap">
          <div class="t">${escapeHtml(a.title)}</div>
          <div class="l">${escapeHtml(a.location || '')}</div>
        </div>
      </div>
      ${starRatingHtml(rating)}
    </div>`;
}

/* ---------- Comparative ranking flow (swipeable duel) ---------- */
let rankSession = null;
let isSubmittingActivity = false;

function startRankingFlow() {
  isSubmittingActivity = false;
  const list = currentUser.rankedList.filter(id => activitiesMap[id]);
  if (list.length === 0) { finalizeNewActivity(0); return; }
  rankSession = { lo: 0, hi: list.length, list, totalSteps: Math.ceil(Math.log2(list.length + 1)) || 1, step: 0 };
  showComparisonStep();
}

function showComparisonStep() {
  const { lo, hi, list } = rankSession;
  if (lo >= hi) { finalizeNewActivity(lo); return; }
  const mid = Math.floor((lo + hi) / 2);
  const otherId = list[mid];
  const other = activitiesMap[otherId];
  const newTi = typeInfo(logState.type);
  const otherTi = typeInfo(other.type);
  rankSession.step++;
  const pct = Math.min(100, Math.round((rankSession.step / (rankSession.totalSteps + 1)) * 100));

  const overlay = document.createElement('div');
  overlay.className = 'overlay center';
  overlay.id = 'rankOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Which did you enjoy more?</div>
      <div class="modal-sub">Both are shown below — drag or tap the one you liked more</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="duel-compare">
        <div class="duel-card ref">
          <span class="duel-card-label">Already ranked</span>
          ${ICONS[otherTi.icon]}
          <span class="name">${escapeHtml(other.title)}</span>
          <span class="loc">${escapeHtml(other.location || '')}</span>
        </div>
        <span class="duel-vs">VS</span>
        <div class="duel-card front" id="duelFront">
          <div class="duel-stamp right" id="stampRight">Prefer this</div>
          <div class="duel-stamp left" id="stampLeft">Prefer that</div>
          <span class="duel-card-label">Just logged</span>
          ${ICONS[newTi.icon]}
          <span class="name">${escapeHtml(logState.title)}</span>
          <span class="loc">${escapeHtml(logState.location || 'New activity')}</span>
        </div>
      </div>
      <div class="duel-hint-row">
        <span>${ICONS.arrowLeft}<span>${escapeHtml(other.title)}</span></span>
        <span>${ICONS.arrowRight}<span>${escapeHtml(logState.title)}</span></span>
      </div>
      <div class="duel-actions">
        <button class="duel-btn" id="duelLeftBtn" title="Prefer ${escapeHtml(other.title)}">${ICONS.arrowLeft}</button>
        <button class="duel-btn like" id="duelRightBtn" title="Prefer ${escapeHtml(logState.title)}">${ICONS.arrowRight}</button>
      </div>
      <button class="btn-ghost" id="skipRank" style="display:block; margin: 4px auto 0;">Not sure — put it in the middle</button>
    </div>`;
  document.body.appendChild(overlay);

  const front = document.getElementById('duelFront');
  const stampRight = document.getElementById('stampRight');
  const stampLeft = document.getElementById('stampLeft');
  const threshold = 90;
  let dx = 0, dragging = false, pointerId = null, startX = 0, settled = false;

  function setTransform(x, animate) {
    front.style.transition = animate ? 'transform 0.25s ease' : 'none';
    front.style.transform = 'translateX(' + x + 'px) rotate(' + (x / 18) + 'deg)';
    const p = Math.max(-1, Math.min(1, x / threshold));
    stampRight.style.opacity = String(Math.max(0, p));
    stampLeft.style.opacity = String(Math.max(0, -p));
  }

  // Locking the overlay the instant a choice is made closes the race that caused
  // double-logging: without this, the ~200ms fly-out animation left every control
  // (arrows, "not sure") still clickable, so a second tap during that window fired
  // a second, independent finalizeNewActivity() call.
  function lockOverlay() {
    overlay.style.pointerEvents = 'none';
  }

  function commit(direction) {
    if (settled) return;
    settled = true;
    lockOverlay();
    front.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    front.style.transform = 'translateX(' + (direction * 500) + 'px) rotate(' + (direction * 20) + 'deg)';
    front.style.opacity = '0';
    setTimeout(() => {
      overlay.remove();
      if (direction > 0) { rankSession.hi = mid; } else { rankSession.lo = mid + 1; }
      showComparisonStep();
    }, 180);
  }

  front.addEventListener('pointerdown', (e) => {
    if (settled) return;
    dragging = true; pointerId = e.pointerId; startX = e.clientX;
    try { front.setPointerCapture(pointerId); } catch (err) {}
  });
  front.addEventListener('pointermove', (e) => {
    if (!dragging || settled) return;
    dx = e.clientX - startX;
    setTransform(dx, false);
  });
  function endDrag() {
    if (!dragging || settled) return;
    dragging = false;
    if (dx > threshold) commit(1);
    else if (dx < -threshold) commit(-1);
    else setTransform(0, true);
    dx = 0;
  }
  front.addEventListener('pointerup', endDrag);
  front.addEventListener('pointercancel', endDrag);

  document.getElementById('duelLeftBtn').addEventListener('click', () => commit(-1));
  document.getElementById('duelRightBtn').addEventListener('click', () => commit(1));
  document.getElementById('skipRank').addEventListener('click', () => {
    if (settled) return;
    settled = true;
    lockOverlay();
    overlay.remove();
    finalizeNewActivity(mid);
  });
}

async function finalizeNewActivity(insertIndex) {
  if (isSubmittingActivity) return;
  isSubmittingActivity = true;
  const id = uid();
  let photoUrl = null;
  if (pendingPhoto && assets) {
    try {
      toast('Uploading photo…');
      const res = await assets.upload(pendingPhoto);
      photoUrl = res && res.url;
    } catch (e) { /* continue without photo */ }
  }
  const data = {
    userId: currentUser.id,
    userName: currentUser.name,
    userColor: currentUser.color,
    type: logState.type,
    title: logState.title,
    location: logState.location,
    review: logState.review,
    photoUrl: photoUrl,
    timestamp: Date.now(),
  };
  try { await db.doc('activities/' + id).set(data); } catch (e) { toast('Could not save activity — try again'); isSubmittingActivity = false; return; }

  const newList = currentUser.rankedList.filter(x => activitiesMap[x]);
  newList.splice(insertIndex, 0, id);
  currentUser.rankedList = newList;
  try { await db.doc('users/' + currentUser.id).update({ rankedList: newList }); } catch (e) {}

  activitiesMap[id] = { id, ...data };
  activitiesOrder.unshift(id);

  toast('Added! Ranked #' + (insertIndex + 1) + ' of ' + newList.length);
  currentTab = 'rankings';
  renderScreen();
  isSubmittingActivity = false;
}

init();
</script>
