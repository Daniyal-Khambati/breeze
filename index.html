<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Breeze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,600;1,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6f0;
  --surface: #ffffff;
  --surface-2: #f2ece2;
  --surface-3: #e8ded0;
  --border: #e3d9c9;
  --text: #2b2a22;
  --text-secondary: #6b6255;
  --text-muted: #a79c8c;
  --accent: #5f7d54;
  --accent-strong: #46603b;
  --accent-soft: rgba(95, 125, 84, 0.12);
  --on-accent: #ffffff;
  --gold: #c9a13f;
  --gold-soft: rgba(201, 161, 63, 0.18);
  --on-gold: #2b2a22;
  --danger: #b5533f;
  --danger-soft: rgba(181, 83, 63, 0.12);
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(43, 42, 34, 0.06);
  --shadow-md: 0 8px 24px rgba(43, 42, 34, 0.08);
  --font-sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  font-size: 15px; line-height: 1.45;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 84px; }
img { max-width: 100%; display: block; }
button { font-family: var(--font-sans); cursor: pointer; }
input, textarea, select { font-family: var(--font-sans); }
[hidden] { display: none !important; }
svg { width: 1em; height: 1em; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding: 18px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand {
  font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 22px;
  letter-spacing: -0.01em; color: var(--accent);
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.log-btn {
  display: flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent);
  border: none; padding: 8px 14px 8px 11px; border-radius: 999px; font-weight: 700; font-size: 13px;
}
.log-btn svg { font-size: 15px; }
.log-btn:active { background: var(--accent-strong); }
.avatar-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none; color: #fff;
  font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.02em;
}

/* Onboarding */
.onboard-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px; text-align: center;
}
.onboard-mark {
  width: 52px; height: 52px; border-radius: var(--radius-lg); background: var(--accent-soft);
  color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 22px;
}
.onboard-wrap h1 {
  font-family: var(--font-display); font-style: italic; font-weight: 700; color: var(--accent);
  font-size: 34px; margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance;
}
.onboard-wrap p { color: var(--text-secondary); font-size: 14.5px; line-height: 1.55; margin: 0 0 30px; max-width: 320px; text-wrap: balance; }
.onboard-form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }

.field-input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 14.5px; outline: none;
}
.field-input:focus { border-color: var(--accent); }
textarea.field-input { resize: none; font-size: 14.5px; }

.btn-primary {
  background: var(--accent); color: var(--on-accent); border: none; padding: 13px 20px; border-radius: var(--radius-md);
  font-weight: 700; font-size: 14.5px; width: 100%;
}
.btn-primary:active { background: var(--accent-strong); }
.btn-primary:disabled { opacity: 0.5; }
.btn-secondary {
  background: var(--surface); color: var(--text); border: 1.5px solid var(--border);
  padding: 11px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 13.5px;
}
.btn-ghost {
  background: transparent; border: none; color: var(--text-secondary); font-size: 12.5px; font-weight: 600;
  padding: 6px;
}
.btn-ghost:hover { color: var(--text); }

/* Main content */
.screen { flex: 1; padding: 4px 20px 20px; }
.screen-title {
  font-family: var(--font-display); font-weight: 600; font-size: 25px; margin: 4px 0 4px;
  letter-spacing: -0.01em; text-wrap: balance;
}
.screen-sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 16px; }

/* Stories row */
.stories-row { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 14px; margin-bottom: 4px; scrollbar-width: none; }
.stories-row::-webkit-scrollbar { display: none; }
.story-bubble {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px;
  background: none; border: none; padding: 0;
}
.story-ring {
  width: 56px; height: 56px; border-radius: 50%; padding: 2.5px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border);
}
.story-ring.unseen { border-color: var(--accent); }
.story-ring.add { border: 2px dashed var(--border); background: var(--accent-soft); }
.story-ring-inner {
  width: 100%; height: 100%; border-radius: 50%; color: #fff; font-weight: 700; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.story-ring-inner.add-inner { background: none; color: var(--accent); font-size: 18px; }
.story-bubble .label {
  font-size: 10.5px; font-weight: 600; color: var(--text-secondary); max-width: 62px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

/* Filter dropdown */
.filter-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.filter-dropdown { position: relative; }
.filter-trigger {
  display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--text);
}
.filter-trigger svg:first-child { font-size: 13px; color: var(--text-secondary); }
.filter-trigger svg:last-child { font-size: 13px; color: var(--text-muted); transition: transform 0.15s ease; }
.filter-trigger.open svg:last-child { transform: rotate(180deg); }
.filter-menu {
  position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 6px; min-width: 172px; z-index: 15;
  display: flex; flex-direction: column; gap: 1px; max-height: 320px; overflow-y: auto;
}
.filter-option {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px;
  font-weight: 600; color: var(--text-secondary); background: none; border: none; width: 100%; text-align: left;
}
.filter-option svg { font-size: 15px; }
.filter-option.active { background: var(--accent-soft); color: var(--accent-strong); }

/* Activity card */
.card {
  background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border);
  margin-bottom: 14px; overflow: hidden;
}
.card-photo { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: var(--surface-2); }
.card-body { padding: 14px 16px 15px; }
.card-user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.mini-avatar {
  width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.card-user-name { font-weight: 700; font-size: 13px; }
.card-time { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.card-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.card-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.card-loc { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 9px; }
.card-loc svg { font-size: 13px; color: var(--text-muted); }
.card-review { font-size: 13.5px; color: var(--text); line-height: 1.55; margin-bottom: 11px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.rank-badge {
  display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 4px 10px 4px 8px;
  border-radius: 999px; background: var(--surface-2); color: var(--text-secondary);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.rank-badge svg { font-size: 12px; }
.rank-badge.empty { background: none; padding: 4px 0; font-family: var(--font-sans); }
.save-btn {
  background: none; border: none; padding: 4px; color: var(--text-muted); font-size: 19px;
  display: flex; align-items: center;
}
.save-btn.saved { color: var(--accent); }
.type-tag {
  display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px;
  border-radius: 999px; background: var(--surface-2); color: var(--text-secondary);
}
.type-tag svg { font-size: 12.5px; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state .icon-wrap {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 14px;
}
.empty-state p { font-size: 13.5px; margin: 0; max-width: 260px; margin-inline: auto; line-height: 1.5; }
.empty-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.empty-actions .btn-primary, .empty-actions .btn-secondary { width: auto; padding-inline: 18px; }

/* Log form */
.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; display: block;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.type-opt {
  padding: 12px 4px 10px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: var(--text-secondary);
}
.type-opt.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
.type-opt svg { font-size: 19px; }
.photo-upload {
  border: 1.5px dashed var(--border); border-radius: var(--radius-md); padding: 18px; text-align: center;
  color: var(--text-muted); font-size: 12.5px; position: relative; cursor: pointer;
}
.photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-preview { width: 100%; border-radius: var(--radius-md); margin-top: 10px; max-height: 190px; object-fit: cover; }

/* Overlay / modal */
.overlay {
  position: fixed; inset: 0; background: rgba(30, 27, 20, 0.5); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
}
.overlay.center { align-items: center; padding: 20px; }
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border: 1px solid var(--border); border-bottom: none;
}
.overlay.center .modal { border-radius: 18px; border-bottom: 1px solid var(--border); }
.modal-title {
  font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 4px;
  text-align: center; letter-spacing: -0.01em;
}
.modal-sub { font-size: 12.5px; color: var(--text-secondary); text-align: center; margin: 0 0 20px; }

/* Friends sheet */
.friend-code-box {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px;
}
.friend-code-box .code { font-family: var(--font-mono); font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: var(--text); }
.add-friend-row { display: flex; gap: 8px; }
.add-friend-row .field-input { flex: 1; }
.add-friend-row .btn-primary { width: auto; flex-shrink: 0; padding-inline: 18px; }
.friend-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; }
.friend-row .name { flex: 1; font-weight: 600; font-size: 13.5px; }

/* Duel comparison */
.duel-stack { position: relative; height: 220px; margin: 4px 0 18px; }
.duel-card {
  position: absolute; inset: 0; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 20px; text-align: center;
}
.duel-card.back { transform: scale(0.94) translateY(12px); opacity: 0.75; z-index: 1; }
.duel-card.front {
  z-index: 2; background: var(--surface); box-shadow: var(--shadow-md); cursor: grab; user-select: none;
  touch-action: pan-y; will-change: transform;
}
.duel-card.front:active { cursor: grabbing; }
.duel-card svg { font-size: 26px; color: var(--text-secondary); }
.duel-card .name { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.duel-card .loc { font-size: 11.5px; color: var(--text-muted); }
.duel-stamp {
  position: absolute; top: 14px; padding: 5px 11px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.06em; opacity: 0; border: 2px solid; pointer-events: none;
}
.duel-stamp.right { right: 14px; color: var(--accent-strong); border-color: var(--accent); transform: rotate(8deg); }
.duel-stamp.left { left: 14px; color: var(--text-secondary); border-color: var(--text-muted); transform: rotate(-8deg); }
.vs-pill {
  position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); background: var(--surface);
  border: 1.5px solid var(--border); color: var(--text-muted); font-size: 10px; font-weight: 800;
  letter-spacing: 0.08em; padding: 3px 9px; border-radius: 999px; z-index: 3;
}
.duel-actions { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 6px; }
.duel-btn {
  width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
}
.duel-btn svg { font-size: 19px; }
.duel-btn.like { border-color: var(--accent); color: var(--accent); }

/* Ranking list */
.rank-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px;
}
.rank-num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--text-secondary);
  font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-family: var(--font-mono);
}
.rank-num.top { background: var(--gold); color: var(--on-gold); }
.rank-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; }
.rank-info svg { font-size: 15px; color: var(--text-muted); flex-shrink: 0; }
.rank-info .t-wrap { min-width: 0; }
.rank-info .t { font-family: var(--font-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-info .l { font-size: 11.5px; color: var(--text-muted); }

/* Bottom nav */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex; justify-content: center;
}
.bottomnav-inner { max-width: 480px; width: 100%; display: flex; }
.navbtn {
  flex: 1; background: none; border: none; padding: 11px 4px 9px; display: flex; flex-direction: column;
  align-items: center; gap: 4px; color: var(--text-muted); font-size: 10.5px; font-weight: 700;
  border-top: 2px solid transparent; margin-top: -1px;
}
.navbtn svg { font-size: 19px; }
.navbtn.active { color: var(--accent); border-top-color: var(--accent); }

.toast {
  position: fixed; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px;
  font-weight: 600; z-index: 200; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

.stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; text-align: center; }
.stat-card .n { font-size: 21px; font-weight: 800; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stat-card .l { font-size: 10.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

.error-text { color: var(--danger); font-size: 12px; margin-top: 5px; }

/* Story viewer (deliberately dark, independent of the app's light theme) */
.story-viewer {
  position: fixed; inset: 0; z-index: 300; background: #14140f; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); touch-action: none;
}
.story-progress-row { position: relative; z-index: 4; display: flex; gap: 4px; padding: 10px 12px 0; }
.story-seg { flex: 1; height: 3px; background: rgba(255,255,255,0.28); border-radius: 2px; overflow: hidden; }
.story-seg-fill { display: block; height: 100%; width: 0%; background: #fff; }
.story-seg.done .story-seg-fill { width: 100%; }
.story-seg.active .story-seg-fill { animation: storyFill 4.5s linear forwards; }
@keyframes storyFill { from { width: 0%; } to { width: 100%; } }
.story-header { position: relative; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px; }
.story-header-meta { min-width: 0; }
.story-header-name { color: #fff; font-weight: 700; font-size: 13px; }
.story-header-time { color: rgba(255,255,255,0.65); font-size: 11px; font-family: var(--font-mono); }
.story-close { margin-left: auto; background: none; border: none; color: #fff; font-size: 20px; padding: 6px; }
.story-content { flex: 1; position: relative; background-size: cover; background-position: center; display: flex; align-items: flex-end; overflow: hidden; }
.story-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0) 55%); }
.story-icon { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); font-size: 68px; color: rgba(255,255,255,0.85); }
.story-caption { position: relative; z-index: 2; padding: 18px 18px calc(26px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 7px; color: #fff; }
.story-caption .type-tag { background: rgba(255,255,255,0.18); color: #fff; align-self: flex-start; }
.story-title { font-family: var(--font-display); font-weight: 600; font-size: 21px; }
.story-loc { display: flex; gap: 5px; align-items: center; font-size: 12.5px; color: rgba(255,255,255,0.85); }
.story-review { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.92); }
.story-rank { align-self: flex-start; font-family: var(--font-mono); font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.16); padding: 4px 10px; border-radius: 999px; }
.story-nav-zone { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 3; background: transparent; border: none; padding: 0; }
.story-nav-zone.left { left: 0; }
.story-nav-zone.right { right: 0; width: 60%; }
</style>
</head>
<body>
<div id="app"></div>

<script>
function svgIcon(paths) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}
const ICONS = {
  home: svgIcon('<path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H9v-6h6v6h2.5a1 1 0 0 0 1-1V9.5"/>'),
  ranks: svgIcon('<path d="M4 20V12"/><path d="M10 20V8"/><path d="M16 20V4"/>'),
  saved: svgIcon('<path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/>'),
  savedFilled: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>',

const TYPES = [
  { id: 'hike', label: 'Hike', icon: 'hike' },
  { id: 'lookout', label: 'Lookout', icon: 'lookout' },
  { id: 'walk', label: 'Walk', icon: 'walk' },
  { id: 'kayak', label: 'Kayak', icon: 'kayak' },
  { id: 'camp', label: 'Camp', icon: 'camp' },
  { id: 'bike', label: 'Bike', icon: 'bike' },
  { id: 'swim', label: 'Swim', icon: 'swim' },
  { id: 'other', label: 'Other', icon: 'other' },
];
const AVATAR_TONES = ['#c07d5f', '#5f7d54', '#5f7f91', '#b98b34', '#818c5a', '#a9727a'];
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function typeInfo(id) { return TYPES.find(t => t.id === id) || TYPES[TYPES.length - 1]; }
function colorForId(id) {
  let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_TONES[h % AVATAR_TONES.length];
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
}
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function escapeHtml(str) {
  const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML;
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function generateCode() {
  let s = '';
  for (let i = 0; i < 6; i++) s += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
  return s;
}
async function generateUniqueCode() {
  for (let i = 0; i < 5; i++) {
    const code = generateCode();
    try {
      const snap = await db.collection('users').where('code', '==', code).limit(1).get();
      if (!snap.docs.length) return code;
    } catch (e) { return code; }
  }
  return generateCode();
}

let db = null, assets = null;
let currentUser = null; // {id, name, color, code, rankedList, bucketList, friends}
let activitiesMap = {};   // id -> activity data
let activitiesOrder = []; // ids sorted by timestamp desc
let usersMap = {};        // id -> {name,color} (lightweight cache from activity docs)
let friendDocs = {};       // friendId -> normalized friend user doc
let friendUnsubs = {};     // friendId -> unsubscribe fn
let viewedStoryUsers = new Set();
let currentTab = 'feed';
let feedFilter = 'all';
let pendingPhoto = null;
let unsubFns = [];

const app = document.getElementById('app');

function toast(msg) {
  let el = document.getElementById('toastEl');
  if (!el) { el = document.createElement('div'); el.id = 'toastEl'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function readStoredUserId() {
  try {
    const id = localStorage.getItem('breeze_user_id');
    if (id) return id;
    const legacy = localStorage.getItem('wl_user_id');
    if (legacy) { localStorage.setItem('breeze_user_id', legacy); return legacy; }
  } catch (e) {}
  return null;
}

async function init() {
  try { db = await claude.use('db'); } catch (e) { db = null; }
  try { assets = await claude.use('assets'); } catch (e) { assets = null; }

  const userId = readStoredUserId();

  if (!db) { renderNoDb(); return; }

  if (userId) {
    try {
      const doc = await db.doc('users/' + userId).get();
      if (doc && doc.exists !== false && (doc.data ? doc.data() : doc)) {
        currentUser = normalizeUser(userId, doc.data ? doc.data() : doc);
      }
    } catch (e) {}
  }

  if (!currentUser) { renderOnboarding(); }
  else { subscribeAll(); renderShell(); }
}

function normalizeUser(id, data) {
  return {
    id,
    name: data.name || 'Explorer',
    color: data.color || colorForId(id),
    code: data.code || '',
    rankedList: Array.isArray(data.rankedList) ? data.rankedList : [],
    bucketList: Array.isArray(data.bucketList) ? data.bucketList : [],
    friends: Array.isArray(data.friends) ? data.friends : [],
  };
}

function renderNoDb() {
  app.innerHTML = `
    <div class="onboard-wrap">
      <div class="onboard-mark">${ICONS.pin}</div>
      <h1>Breeze</h1>
      <p>This preview needs shared storage to sync activities between friends, which isn't available in this view. Try opening the published link instead.</p>
    </div>`;
}

function renderOnboarding() {
  app.innerHTML = `
    <div class="onboard-wrap">
      <div class="onboard-mark">${ICONS.pin}</div>
      <h1>Breeze</h1>
      <p>Log your hikes, lookouts, and trips. Rank them against each other, and see what your friends have been exploring.</p>
      <div class="onboard-form">

      </div>
    </div>`;
  const input = document.getElementById('nameInput');
  const err = document.getElementById('nameError');
  const go = async () => {
    const name = input.value.trim();

    err.hidden = true;
    const id = uid();
    const color = colorForId(id);
    const code = await generateUniqueCode();
    const data = { name, color, code, rankedList: [], bucketList: [], friends: [], createdAt: Date.now() };
    try { await db.doc('users/' + id).set(data); } catch (e) { toast('Could not create profile — try again'); return; }
    try { localStorage.setItem('breeze_user_id', id); } catch (e) {}
    currentUser = normalizeUser(id, data);
    subscribeAll();
    renderShell();
  };

function syncFriendSubscriptions() {
  const friends = currentUser.friends || [];
  friends.forEach(fid => {
    if (friendUnsubs[fid]) return;
    try {
      friendUnsubs[fid] = db.doc('users/' + fid).onSnapshot((snap) => {
        const data = snap && snap.data ? snap.data() : snap;
        if (data) { friendDocs[fid] = normalizeUser(fid, data); renderScreen(); }
      });
    } catch (e) {}
  });
  Object.keys(friendUnsubs).forEach(fid => {
    if (!friends.includes(fid)) {
      try { friendUnsubs[fid](); } catch (e) {}
      delete friendUnsubs[fid];
      delete friendDocs[fid];
    }
  });
}

function subscribeAll() {
  try {
    const userUnsub = db.doc('users/' + currentUser.id).onSnapshot((snap) => {
      const data = snap && snap.data ? snap.data() : snap;
      if (data) {
        const prevFriends = (currentUser.friends || []).join(',');
        currentUser = normalizeUser(currentUser.id, data);
        syncFriendSubscriptions();
        const friendsChanged = prevFriends !== (currentUser.friends || []).join(',');
        if (friendsChanged || currentTab === 'rankings' || currentTab === 'saved') renderScreen();
        else updateFeedRankBadges();
      }
    });
    if (userUnsub) unsubFns.push(userUnsub);
  } catch (e) {}

  try {
    const q = db.collection('activities').orderBy('timestamp', 'desc').limit(200);
    const actUnsub = q.onSnapshot((snap) => {
      const docs = snap && snap.docs ? snap.docs : [];
      activitiesMap = {};
      activitiesOrder = [];
      docs.forEach(d => {
        const data = d.data ? d.data() : d;
        const id = d.id || data.id;
        activitiesMap[id] = { id, ...data };
        activitiesOrder.push(id);
        if (data.userId && !usersMap[data.userId]) {
          usersMap[data.userId] = { name: data.userName, color: data.userColor };
        }
      });
      if (currentTab === 'feed' || currentTab === 'saved' || currentTab === 'rankings') renderScreen();
    });
    if (actUnsub) unsubFns.push(actUnsub);
  } catch (e) {}
}

function renderShell() {
  app.innerHTML = `
    <div class="topbar">

      <div class="topbar-actions">
        <button class="log-btn" id="logBtn">${ICONS.plus}Log</button>

      </div>

    <div class="bottomnav">
      <div class="bottomnav-inner">
        <button class="navbtn" data-tab="feed">${ICONS.home}Feed</button>
        <button class="navbtn" data-tab="rankings">${ICONS.ranks}My ranks</button>
        <button class="navbtn" data-tab="saved">${ICONS.saved}Saved</button>
      </div>
    </div>

  document.getElementById('logBtn').addEventListener('click', openLogModal);

function showSwitchAccount() {
  if (confirm('Switch to a different name on this device? This will not delete your saved data, just log this browser out.')) {
    try { localStorage.removeItem('breeze_user_id'); localStorage.removeItem('wl_user_id'); } catch (e) {}
    unsubFns.forEach(fn => { try { fn(); } catch (e) {} });
    unsubFns = [];
    Object.values(friendUnsubs).forEach(fn => { try { fn(); } catch (e) {} });
    friendUnsubs = {};
    friendDocs = {};

function renderScreen() {
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
  const host = document.getElementById('screenHost');

function updateFeedRankBadges() {
  document.querySelectorAll('[data-rank-owner]').forEach(el => {
    const ownerId = el.getAttribute('data-rank-owner');
    const actId = el.getAttribute('data-rank-act');
    const txt = rankBadgeText(ownerId, actId);
    el.textContent = txt || 'Friend pick';

}

function rankBadgeText(ownerId, actId) {
  const list = ownerId === currentUser.id ? currentUser.rankedList : (friendDocs[ownerId] ? friendDocs[ownerId].rankedList : null);
  if (!list) return '';
  const idx = list.indexOf(actId);
  if (idx === -1) return '';
  return '#' + (idx + 1) + ' of ' + list.length;
}

function isVisibleActivity(a) {
  return a.userId === currentUser.id || (currentUser.friends || []).includes(a.userId);
}

/* ---------- Stories ---------- */
function storyGroupsForFeed() {
  const groups = [];
  const mine = activitiesOrder.filter(id => activitiesMap[id].userId === currentUser.id).map(id => activitiesMap[id]);
  if (mine.length) groups.push({ id: currentUser.id, name: currentUser.name, color: currentUser.color, isSelf: true, items: mine });
  (currentUser.friends || []).forEach(fid => {
    const items = activitiesOrder.filter(id => activitiesMap[id].userId === fid).map(id => activitiesMap[id]);
    if (!items.length) return;
    const fd = friendDocs[fid];
    const cached = usersMap[fid];
    groups.push({
      id: fid,
      name: (fd && fd.name) || (cached && cached.name) || 'Friend',
      color: (fd && fd.color) || (cached && cached.color) || colorForId(fid),
      isSelf: false,
      items,
    });
  });
  const self = groups.filter(g => g.isSelf);
  const rest = groups.filter(g => !g.isSelf).sort((a, b) => (b.items[0].timestamp || 0) - (a.items[0].timestamp || 0));
  return self.concat(rest);
}

function renderStoriesRow() {
  const groups = storyGroupsForFeed();
  const addBubble = `
    <button class="story-bubble" id="addFriendBubble">
      <span class="story-ring add"><span class="story-ring-inner add-inner">${ICONS.plus}</span></span>
      <span class="label">Add friend</span>
    </button>`;
  const bubbles = groups.map(g => {
    const unseen = !g.isSelf && !viewedStoryUsers.has(g.id);
    return `
    <button class="story-bubble" data-story-user="${g.id}">
      <span class="story-ring ${unseen ? 'unseen' : ''}">
        <span class="story-ring-inner" style="background:${g.color}">${escapeHtml(initials(g.name))}</span>
      </span>
      <span class="label">${g.isSelf ? 'Your story' : escapeHtml(g.name.split(' ')[0])}</span>
    </button>`;
  }).join('');
  return `<div class="stories-row">${addBubble}${bubbles}</div>`;
}

let storyState = null;

function openStoryViewer(userId) {
  const groups = storyGroupsForFeed();
  const groupIndex = groups.findIndex(g => g.id === userId);
  if (groupIndex === -1) return;
  viewedStoryUsers.add(userId);
  storyState = { groups, groupIndex, itemIndex: 0, timer: null };
  renderStoryViewer();
}

function closeStoryViewer() {
  if (storyState && storyState.timer) clearTimeout(storyState.timer);
  const el = document.getElementById('storyViewer');
  if (el) el.remove();
  storyState = null;
  renderScreen();
}

function storyNext() {
  if (!storyState) return;
  const group = storyState.groups[storyState.groupIndex];
  if (storyState.itemIndex < group.items.length - 1) {
    storyState.itemIndex++;
    renderStoryViewer();
  } else if (storyState.groupIndex < storyState.groups.length - 1) {
    storyState.groupIndex++;
    storyState.itemIndex = 0;
    viewedStoryUsers.add(storyState.groups[storyState.groupIndex].id);
    renderStoryViewer();
  } else {
    closeStoryViewer();
  }
}

function storyPrev() {
  if (!storyState) return;
  if (storyState.itemIndex > 0) { storyState.itemIndex--; renderStoryViewer(); }
  else if (storyState.groupIndex > 0) {
    storyState.groupIndex--;
    storyState.itemIndex = storyState.groups[storyState.groupIndex].items.length - 1;
    renderStoryViewer();
  }
}

function attachStorySwipeClose(el) {
  let startY = 0, dragging = false, pid = null;
  el.addEventListener('pointerdown', (e) => {
    dragging = true; pid = e.pointerId; startY = e.clientY;
    try { el.setPointerCapture(pid); } catch (err) {}
    if (storyState && storyState.timer) clearTimeout(storyState.timer);
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dy = Math.max(0, e.clientY - startY);
    el.style.transform = 'translateY(' + dy + 'px)';
    el.style.opacity = String(1 - Math.min(0.6, dy / 400));
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    const dy = e.clientY - startY;
    if (dy > 110) { closeStoryViewer(); return; }
    el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
    el.style.transform = ''; el.style.opacity = '';
    setTimeout(() => { el.style.transition = ''; }, 210);
    if (storyState) storyState.timer = setTimeout(storyNext, 4500);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function renderStoryViewer() {
  let el = document.getElementById('storyViewer');
  let fresh = false;
  if (!el) {
    el = document.createElement('div');
    el.id = 'storyViewer';
    el.className = 'story-viewer';
    document.body.appendChild(el);
    fresh = true;
  }
  const group = storyState.groups[storyState.groupIndex];
  const item = group.items[storyState.itemIndex];
  const ti = typeInfo(item.type);
  const rankTxt = rankBadgeText(item.userId, item.id);
  const bgStyle = item.photoUrl ? `background-image:url('${escapeHtml(item.photoUrl)}')` : `background-color:${group.color}`;
  const displayName = group.isSelf ? currentUser.name : group.name;

  el.innerHTML = `
    <div class="story-progress-row">
      ${group.items.map((_, i) => `<span class="story-seg ${i < storyState.itemIndex ? 'done' : ''} ${i === storyState.itemIndex ? 'active' : ''}"><span class="story-seg-fill"></span></span>`).join('')}
    </div>
    <div class="story-header">
      <div class="mini-avatar" style="background:${group.color}">${escapeHtml(initials(displayName))}</div>
      <div class="story-header-meta">
        <div class="story-header-name">${escapeHtml(displayName)}</div>
        <div class="story-header-time">${timeAgo(item.timestamp || Date.now())}</div>
      </div>
      <button class="story-close" id="storyCloseBtn">${ICONS.close}</button>
    </div>
    <div class="story-content" style="${bgStyle}">
      ${item.photoUrl ? '<div class="story-scrim"></div>' : `<div class="story-icon">${ICONS[ti.icon]}</div>`}
      <div class="story-caption">
        <span class="type-tag">${ICONS[ti.icon]}${ti.label}</span>
        <div class="story-title">${escapeHtml(item.title)}</div>
        <div class="story-loc">${ICONS.pin}${escapeHtml(item.location || '')}</div>
        ${item.review ? `<div class="story-review">${escapeHtml(item.review)}</div>` : ''}
        ${rankTxt ? `<div class="story-rank">${group.isSelf ? 'My' : 'Their'} ${rankTxt}</div>` : ''}
      </div>
    </div>
    <button class="story-nav-zone left" id="storyPrevZone" aria-label="Previous"></button>
    <button class="story-nav-zone right" id="storyNextZone" aria-label="Next"></button>
  `;
  document.getElementById('storyCloseBtn').addEventListener('click', closeStoryViewer);
  document.getElementById('storyPrevZone').addEventListener('click', storyPrev);
  document.getElementById('storyNextZone').addEventListener('click', storyNext);
  if (fresh) attachStorySwipeClose(el);
  if (storyState.timer) clearTimeout(storyState.timer);
  storyState.timer = setTimeout(storyNext, 4500);
}

async function addFriendByCode(overlay) {
  const input = document.getElementById('friendCodeInput');
  const err = document.getElementById('friendError');
  const code = input.value.trim().toUpperCase();
  err.hidden = true;
  if (!code) { err.textContent = 'Enter a code'; err.hidden = false; return; }
  try {
    const snap = await db.collection('users').where('code', '==', code).limit(1).get();
    const docs = snap && snap.docs ? snap.docs : [];
    if (!docs.length) { err.textContent = "No one found with that code"; err.hidden = false; return; }
    const targetDoc = docs[0];
    const targetId = targetDoc.id;
    const targetData = targetDoc.data() || {};
    if (targetId === currentUser.id) { err.textContent = "That's your own code"; err.hidden = false; return; }
    if ((currentUser.friends || []).includes(targetId)) { err.textContent = 'Already friends'; err.hidden = false; return; }
    const newMine = Array.from(new Set([...(currentUser.friends || []), targetId]));
    const newTheirs = Array.from(new Set([...(Array.isArray(targetData.friends) ? targetData.friends : []), currentUser.id]));
    await db.doc('users/' + currentUser.id).update({ friends: newMine });
    await db.doc('users/' + targetId).update({ friends: newTheirs });
    currentUser.friends = newMine;
    syncFriendSubscriptions();
    toast('Added ' + (targetData.name || 'friend'));
    overlay.remove();
    openFriendsSheet();
  } catch (e) {
    err.textContent = "Couldn't add that friend — try again";
    err.hidden = false;
  }
}

async function removeFriend(fid, overlay) {
  const newMine = (currentUser.friends || []).filter(id => id !== fid);
  currentUser.friends = newMine;
  try { await db.doc('users/' + currentUser.id).update({ friends: newMine }); } catch (e) {}
  try {
    const fd = friendDocs[fid];
    if (fd) {
      const theirFriends = (fd.friends || []).filter(id => id !== currentUser.id);
      await db.doc('users/' + fid).update({ friends: theirFriends });
    }
  } catch (e) {}
  syncFriendSubscriptions();
  overlay.remove();
  openFriendsSheet();
}

/* ---------- Feed ---------- */
function renderFeed(host) {
  const visibleIds = activitiesOrder.filter(id => isVisibleActivity(activitiesMap[id]));
  const filtered = visibleIds.filter(id => feedFilter === 'all' || activitiesMap[id].type === feedFilter);
  const currentFilterInfo = feedFilter === 'all' ? null : typeInfo(feedFilter);

  let cardsHtml;
  if (visibleIds.length === 0) {
    if ((currentUser.friends || []).length === 0) {
      cardsHtml = `<div class="empty-state">
        <div class="icon-wrap">${ICONS.home}</div>
        <p>Add friends to see their adventures here — or log your own to get started.</p>
        <div class="empty-actions">
          <button class="btn-secondary" id="emptyAddFriend">Add a friend</button>
          <button class="btn-primary" id="emptyLogActivity">Log an activity</button>
        </div>
      </div>`;
    } else {
      cardsHtml = `<div class="empty-state">
        <div class="icon-wrap">${ICONS.home}</div>
        <p>No activities yet — be the first in your circle to log one.</p>
        <div class="empty-actions"><button class="btn-primary" id="emptyLogActivity">Log an activity</button></div>
      </div>`;
    }
  } else if (filtered.length === 0) {
    cardsHtml = `<div class="empty-state"><div class="icon-wrap">${ICONS[currentFilterInfo.icon]}</div><p>No ${currentFilterInfo.label.toLowerCase()} activities in your circle yet.</p></div>`;
  } else {
    cardsHtml = filtered.map(id => activityCardHtml(activitiesMap[id])).join('');
  }

  host.innerHTML = `
    <h1 class="screen-title">Feed</h1>
    <p class="screen-sub">What your friends have been up to</p>
    ${renderStoriesRow()}
    <div class="filter-row">
      <div class="filter-dropdown">
        <button class="filter-trigger" id="filterTrigger">${currentFilterInfo ? ICONS[currentFilterInfo.icon] : ''}${currentFilterInfo ? currentFilterInfo.label : 'All types'}${ICONS.chevronDown}</button>
        <div class="filter-menu" id="filterMenu" hidden>
          <button class="filter-option ${feedFilter === 'all' ? 'active' : ''}" data-f="all">All types</button>
          ${TYPES.map(t => `<button class="filter-option ${feedFilter === t.id ? 'active' : ''}" data-f="${t.id}">${ICONS[t.icon]}${t.label}</button>`).join('')}
        </div>
      </div>
    </div>
    <div id="feedCards">${cardsHtml}</div>
  `;

  const trigger = document.getElementById('filterTrigger');
  const menu = document.getElementById('filterMenu');
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    const opening = menu.hidden;
    menu.hidden = !menu.hidden;
    trigger.classList.toggle('open', opening);
    if (opening) {
      const onDocClick = () => { menu.hidden = true; trigger.classList.remove('open'); document.removeEventListener('click', onDocClick); };
      document.addEventListener('click', onDocClick);
    }
  });
  menu.querySelectorAll('.filter-option').forEach(btn => btn.addEventListener('click', () => { feedFilter = btn.dataset.f; renderScreen(); }));

  host.querySelectorAll('.save-btn').forEach(b => b.addEventListener('click', () => toggleSave(b.dataset.act)));
  const addFriendBubble = document.getElementById('addFriendBubble');
  if (addFriendBubble) addFriendBubble.addEventListener('click', openFriendsSheet);
  host.querySelectorAll('[data-story-user]').forEach(b => b.addEventListener('click', () => openStoryViewer(b.dataset.storyUser)));
  const emptyAddFriend = document.getElementById('emptyAddFriend');
  if (emptyAddFriend) emptyAddFriend.addEventListener('click', openFriendsSheet);
  const emptyLogActivity = document.getElementById('emptyLogActivity');
  if (emptyLogActivity) emptyLogActivity.addEventListener('click', openLogModal);
}

function activityCardHtml(a) {
  const ti = typeInfo(a.type);
  const isMine = a.userId === currentUser.id;
  const rankTxt = rankBadgeText(a.userId, a.id);
  const saved = currentUser.bucketList.includes(a.id);
  const photo = a.photoUrl ? `<img class="card-photo" src="${escapeHtml(a.photoUrl)}" alt="">` : '';
  return `
    <div class="card">
      ${photo}
      <div class="card-body">
        <div class="card-user-row">
          <div class="mini-avatar" style="background:${a.userColor || colorForId(a.userId||'x')}">${escapeHtml(initials(a.userName))}</div>
          <div style="flex:1">
            <div class="card-user-name">${escapeHtml(a.userName)}</div>
            <div class="card-time">${timeAgo(a.timestamp || Date.now())}</div>
          </div>
          <span class="type-tag">${ICONS[ti.icon]}${ti.label}</span>
        </div>
        <div class="card-title-row"><div class="card-title">${escapeHtml(a.title)}</div></div>
        <div class="card-loc">${ICONS.pin}${escapeHtml(a.location || 'Unspecified')}</div>
        ${a.review ? `<div class="card-review">${escapeHtml(a.review)}</div>` : ''}
        <div class="card-footer">
          <span class="rank-badge ${rankTxt ? '' : 'empty'}" data-rank-owner="${a.userId}" data-rank-act="${a.id}">${rankTxt || (isMine ? '' : 'Friend pick')}</span>
          <button class="save-btn ${saved?'saved':''}" data-act="${a.id}" title="Save to bucket list">${saved ? ICONS.savedFilled : ICONS.saved}</button>
        </div>
      </div>
    </div>`;
}

async function toggleSave(actId) {
  if (!currentUser.bucketList.includes(actId)) {
    if (activitiesMap[actId] && activitiesMap[actId].userId === currentUser.id) { toast("That's your own activity"); return; }
  }
  const list = currentUser.bucketList.slice();
  const idx = list.indexOf(actId);
  if (idx === -1) { list.push(actId); toast('Saved to your bucket list'); }
  else { list.splice(idx, 1); toast('Removed from bucket list'); }
  currentUser.bucketList = list;
  try { await db.doc('users/' + currentUser.id).update({ bucketList: list }); } catch (e) { toast('Could not save — try again'); }
  renderScreen();
}

function renderRankings(host) {
  const list = currentUser.rankedList.filter(id => activitiesMap[id]);
  const stat1 = list.length;
  const types = new Set(list.map(id => activitiesMap[id].type));
  host.innerHTML = `
    <h1 class="screen-title">My rankings</h1>
    <p class="screen-sub">Your adventures, best to worst</p>
    <div class="stat-row">
      <div class="stat-card"><div class="n">${stat1}</div><div class="l">Logged</div></div>
      <div class="stat-card"><div class="n">${types.size}</div><div class="l">Types tried</div></div>
    </div>
    <div id="rankList">
      ${list.length === 0
        ? `<div class="empty-state"><div class="icon-wrap">${ICONS.ranks}</div><p>Log your first activity to start building your ranked list.</p></div>`
        : list.map((id, i) => rankRowHtml(activitiesMap[id], i)).join('')}
    </div>
  `;
}

function rankRowHtml(a, i) {
  const ti = typeInfo(a.type);
  return `
    <div class="rank-row">
      <div class="rank-num ${i===0?'top':''}">${i+1}</div>
      <div class="rank-info">
        ${ICONS[ti.icon]}
        <div class="t-wrap">
          <div class="t">${escapeHtml(a.title)}</div>
          <div class="l">${escapeHtml(a.location || '')}</div>
        </div>
      </div>
    </div>`;
}

function renderSaved(host) {
  const list = currentUser.bucketList.filter(id => activitiesMap[id]);
  host.innerHTML = `
    <h1 class="screen-title">Saved</h1>
    <p class="screen-sub">Places friends ranked highly that you want to try</p>
    <div>
      ${list.length === 0
        ? `<div class="empty-state"><div class="icon-wrap">${ICONS.savedFilled}</div><p>Tag activities from the feed to build your want-to-go list.</p></div>`
        : list.map(id => activityCardHtml(activitiesMap[id])).join('')}
    </div>
  `;
  host.querySelectorAll('.save-btn').forEach(b => b.addEventListener('click', () => toggleSave(b.dataset.act)));
}

/* ---------- Log activity flow ---------- */
let logState = { type: 'hike', title: '', location: '', review: '' };

function openLogModal() {
  logState = { type: 'hike', title: '', location: '', review: '' };
  pendingPhoto = null;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'logOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Log an activity</div>
      <div class="modal-sub">Add it, then rank it against your others</div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <div class="type-grid" id="typeGrid">
          ${TYPES.map(t => `<button class="type-opt ${t.id==='hike'?'active':''}" data-type="${t.id}">${ICONS[t.icon]}${t.label}</button>`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="titleInput">Title</label>
        <input class="field-input" id="titleInput" placeholder="e.g. Buttermilk Falls sunrise hike" maxlength="60">
      </div>
      <div class="form-group">
        <label class="form-label" for="locInput">Location</label>
        <input class="field-input" id="locInput" placeholder="e.g. Ithaca, NY" maxlength="60">
      </div>
      <div class="form-group">
        <label class="form-label" for="reviewInput">Quick review (optional)</label>
        <textarea class="field-input" id="reviewInput" rows="3" placeholder="How was it? Worth the hype?" maxlength="280"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Photo (optional)</label>
        <div class="photo-upload" id="photoUpload">
          <input type="file" accept="image/*" id="photoInput">
          <span id="photoUploadLabel">Tap to add a photo</span>
        </div>
        <img class="photo-preview hidden" id="photoPreview" hidden>
      </div>
      <div class="error-text hidden" id="logError" hidden>Add a title to continue</div>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn-secondary" id="cancelLog" style="flex:1">Cancel</button>
        <button class="btn-primary" id="nextLog" style="flex:2">Next: rank it</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('typeGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('.type-opt'); if (!btn) return;
    logState.type = btn.dataset.type;
    document.querySelectorAll('#typeGrid .type-opt').forEach(b => b.classList.toggle('active', b === btn));
  });
  const photoInput = document.getElementById('photoInput');
  if (!assets) {
    document.getElementById('photoUploadLabel').textContent = 'Photo upload unavailable in this view';
    photoInput.disabled = true;
  } else {
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pendingPhoto = file;
      const url = URL.createObjectURL(file);
      const preview = document.getElementById('photoPreview');
      preview.src = url; preview.hidden = false;
      document.getElementById('photoUploadLabel').textContent = 'Photo selected — tap to change';
    });
  }
  document.getElementById('cancelLog').addEventListener('click', () => overlay.remove());
  document.getElementById('nextLog').addEventListener('click', () => {
    const title = document.getElementById('titleInput').value.trim();
    const err = document.getElementById('logError');
    if (!title) { err.hidden = false; return; }
    err.hidden = true;
    logState.title = title;
    logState.location = document.getElementById('locInput').value.trim();
    logState.review = document.getElementById('reviewInput').value.trim();
    overlay.remove();
    startRankingFlow();
  });
}

/* ---------- Comparative ranking flow (swipeable duel) ---------- */
let rankSession = null;

function startRankingFlow() {
  const list = currentUser.rankedList.filter(id => activitiesMap[id]);
  if (list.length === 0) { finalizeNewActivity(0); return; }
  rankSession = { lo: 0, hi: list.length, list, totalSteps: Math.ceil(Math.log2(list.length + 1)) || 1, step: 0 };
  showComparisonStep();
}

function showComparisonStep() {
  const { lo, hi, list } = rankSession;
  if (lo >= hi) { finalizeNewActivity(lo); return; }
  const mid = Math.floor((lo + hi) / 2);
  const otherId = list[mid];
  const other = activitiesMap[otherId];
  const newTi = typeInfo(logState.type);
  const otherTi = typeInfo(other.type);
  rankSession.step++;
  const pct = Math.min(100, Math.round((rankSession.step / (rankSession.totalSteps + 1)) * 100));

  const overlay = document.createElement('div');
  overlay.className = 'overlay center';
  overlay.id = 'rankOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Which did you enjoy more?</div>
      <div class="modal-sub">Drag the card toward the one you liked more</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="duel-stack" id="duelStack">
        <div class="duel-card back">
          ${ICONS[otherTi.icon]}
          <span class="name">${escapeHtml(other.title)}</span>
          <span class="loc">${escapeHtml(other.location || '')}</span>
        </div>
        <div class="duel-card front" id="duelFront">
          <div class="duel-stamp right" id="stampRight">Prefer this</div>
          <div class="duel-stamp left" id="stampLeft">Prefer that</div>
          ${ICONS[newTi.icon]}
          <span class="name">${escapeHtml(logState.title)}</span>
          <span class="loc">${escapeHtml(logState.location || 'New activity')}</span>
        </div>
        <span class="vs-pill">VS</span>
      </div>
      <div class="duel-actions">
        <button class="duel-btn" id="duelLeftBtn" title="Prefer ${escapeHtml(other.title)}">${ICONS.arrowLeft}</button>
        <button class="duel-btn like" id="duelRightBtn" title="Prefer ${escapeHtml(logState.title)}">${ICONS.arrowRight}</button>
      </div>
      <button class="btn-ghost" id="skipRank" style="display:block; margin: 4px auto 0;">Not sure — put it in the middle</button>
    </div>`;
  document.body.appendChild(overlay);

  const front = document.getElementById('duelFront');
  const stampRight = document.getElementById('stampRight');
  const stampLeft = document.getElementById('stampLeft');
  const threshold = 90;
  let dx = 0, dragging = false, pointerId = null, startX = 0, settled = false;

  function setTransform(x, animate) {
    front.style.transition = animate ? 'transform 0.25s ease' : 'none';
    front.style.transform = 'translateX(' + x + 'px) rotate(' + (x / 18) + 'deg)';
    const p = Math.max(-1, Math.min(1, x / threshold));
    stampRight.style.opacity = String(Math.max(0, p));
    stampLeft.style.opacity = String(Math.max(0, -p));
  }

  function commit(direction) {
    if (settled) return;
    settled = true;
    front.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    front.style.transform = 'translateX(' + (direction * 500) + 'px) rotate(' + (direction * 20) + 'deg)';
    front.style.opacity = '0';
    setTimeout(() => {
      overlay.remove();
      if (direction > 0) { rankSession.hi = mid; } else { rankSession.lo = mid + 1; }
      showComparisonStep();
    }, 180);
  }

  front.addEventListener('pointerdown', (e) => {
    if (settled) return;
    dragging = true; pointerId = e.pointerId; startX = e.clientX;
    try { front.setPointerCapture(pointerId); } catch (err) {}
  });
  front.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    setTransform(dx, false);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (dx > threshold) commit(1);
    else if (dx < -threshold) commit(-1);
    else setTransform(0, true);
    dx = 0;
  }
  front.addEventListener('pointerup', endDrag);
  front.addEventListener('pointercancel', endDrag);

  document.getElementById('duelLeftBtn').addEventListener('click', () => commit(-1));
  document.getElementById('duelRightBtn').addEventListener('click', () => commit(1));
  document.getElementById('skipRank').addEventListener('click', () => { overlay.remove(); finalizeNewActivity(mid); });
}

async function finalizeNewActivity(insertIndex) {
  const id = uid();
  let photoUrl = null;
  if (pendingPhoto && assets) {
    try {
      toast('Uploading photo…');
      const res = await assets.upload(pendingPhoto);
      photoUrl = res && res.url;
    } catch (e) { /* continue without photo */ }
  }
  const data = {
    userId: currentUser.id,
    userName: currentUser.name,
    userColor: currentUser.color,
    type: logState.type,
    title: logState.title,
    location: logState.location,
    review: logState.review,
    photoUrl: photoUrl,
    timestamp: Date.now(),
  };
  try { await db.doc('activities/' + id).set(data); } catch (e) { toast('Could not save activity — try again'); return; }

  const newList = currentUser.rankedList.filter(x => activitiesMap[x]);
  newList.splice(insertIndex, 0, id);
  currentUser.rankedList = newList;
  try { await db.doc('users/' + currentUser.id).update({ rankedList: newList }); } catch (e) {}

  activitiesMap[id] = { id, ...data };
  activitiesOrder.unshift(id);

  toast('Added! Ranked #' + (insertIndex + 1) + ' of ' + newList.length);
  currentTab = 'rankings';
  renderScreen();
}

init();
